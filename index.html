      <button class="btn danger left" onclick="closeModal();removeFromPnl('${r.containerId}')">Remove from P&amp;L</button>
      <button class="btn" onclick="recalcPnlRow('${r.containerId}')" title="Rebuild using today's prices, exchange rate and charges">Recalculate</button>
      <button class="btn" onclick="printPnlDetail('${r.containerId}')">Save as PDF</button>
      <button class="btn primary" onclick="closeModal()">Close</button>
    </div></div>`;
  ov.classList.add('open');
}

function exportPnl(){
  const {rows,tot}=pnlRows();
  if(!rows.length){ toast('Nothing to export'); return; }
  const aoa=[];
  aoa.push([xcell('Profit & Loss — delivered containers',1)]);
  aoa.push([xcell((pnlState.month==='all'?'All months':pnlState.month)+' · selling excludes VAT · '+fmtDate(todayISO()))]);
  aoa.push([]);
  aoa.push(['Container','Delivered','Month','POL','Type','Selling (excl VAT)','Goods (ZAR)','Clearing','Transport','Forwarding (USD)','Forwarding (ZAR)','Total cost','Profit / Loss','Margin %','Status'].map(h=>xcell(h,5)));
  rows.forEach(({r,m})=>{ const p=pnlProfit(r), mg=pnlMargin(r);
    aoa.push([xcell(r.containerNo||''), r.deliveredAt?xdate(r.deliveredAt):xcell(''), xcell(m.label),
      xcell(r.pol||''), xcell(r.containerType||''),
      xcell(pnlSelling(r),7), r.goodsZar==null?xcell(''):xcell(r.goodsZar,7),
      r.clearing==null?xcell(''):xcell(r.clearing,7), r.transport==null?xcell(''):xcell(r.transport,7),
      (r.fwdUsd==null||r.fwdUsd===undefined)?xcell(''):xcell(r.fwdUsd,7),
      r.fwd==null?xcell(''):xcell(r.fwd,7), r.cost==null?xcell(''):xcell(r.cost,7),
      p==null?xcell(''):xcell(p,7), mg==null?xcell(''):xcell(Math.round(mg*10)/10,7),
      xcell(r.complete?'Complete':'Incomplete — '+r.issues.join('; '))]);
  });
  aoa.push([]);
  aoa.push([xcell('Total'+(tot.excluded?' (complete containers only)':''),1),xcell(''),xcell(''),xcell(''),xcell(''),
    xcell(tot.selling,7),xcell(''),xcell(''),xcell(''),xcell(''),xcell(''),xcell(tot.cost,7),xcell(tot.profit,7),
    tot.margin==null?xcell(''):xcell(Math.round(tot.margin*10)/10,7),xcell('')]);
  const width=Math.max(...aoa.map(r=>r.length));
  aoa.forEach(r=>{ while(r.length<width) r.push(xcell('')); });
  downloadBytes(makeXlsx('Profit and Loss', aoa, [17,12,15,11,9,16,14,12,12,15,15,13,14,10,34]), 'profit-and-loss-'+todayISO()+'.xlsx');
  toast('Excel file downloaded');
}

/* ---------- P&L PDF OUTPUT ----------
   Rather than fight the app's dark theme and modal chrome, build a clean self-contained
   A4 document and hand it to the browser's print dialog, where "Save as PDF" is a
   destination option. The doc title becomes the default filename. */
function printDoc(title, bodyHtml, landscape){
  const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    @page{ size:A4 ${landscape?'landscape':'portrait'}; margin:14mm }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
      font-size:11px;color:#111;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .doc-head{display:flex;justify-content:space-between;align-items:flex-end;
      border-bottom:2px solid #111;padding-bottom:9px;margin-bottom:16px}
    .doc-head h1{margin:0;font-size:18px;letter-spacing:-.2px}
    .doc-head .sub{font-size:10.5px;color:#555;margin-top:3px}
    .doc-head .org{font-size:10.5px;color:#555;text-align:right;line-height:1.5}
    h2{font-size:12px;margin:18px 0 7px;padding-bottom:4px;border-bottom:1px solid #ccc}
    h2:first-of-type{margin-top:0}
    table{width:100%;border-collapse:collapse;margin-bottom:4px}
    th,td{padding:5px 7px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
    th{background:#f2f2f2;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;
      border-bottom:1px solid #999}
    td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;
      font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:10.5px}
    tfoot td{border-top:1.5px solid #111;border-bottom:none;font-weight:700;background:#fafafa}
    tr{page-break-inside:avoid}
    .kpis{display:flex;gap:8px;margin-bottom:16px}
    .kpi{flex:1;border:1px solid #ccc;border-radius:5px;padding:8px 10px}
    .kpi .k{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:#666;font-weight:700}
    .kpi .v{font-size:13px;font-weight:700;margin-top:3px;
      font-family:'SFMono-Regular',Consolas,monospace}
    .lines{margin:6px 0 16px}
    .lines .r{display:flex;justify-content:space-between;gap:20px;padding:4px 0;border-bottom:1px dotted #ddd}
    .lines .r.tot{border-top:1.5px solid #111;border-bottom:none;margin-top:4px;padding-top:7px;font-weight:700}
    .lines .r .v{font-family:'SFMono-Regular',Consolas,monospace;font-variant-numeric:tabular-nums}
    .lines .r.ind .l,.lines .r.ind .v{color:#666;padding-left:14px}
    .pos{color:#0a7d37} .neg{color:#c02718} .miss{color:#c02718;font-style:italic}
    .warn{border:1px solid #b8860b;background:#fdf6e3;border-radius:5px;padding:9px 11px;margin-bottom:14px}
    .warn b{color:#8a6508}
    .warn ul{margin:5px 0 0 16px;padding:0;line-height:1.55}
    .foot{margin-top:22px;padding-top:8px;border-top:1px solid #ccc;font-size:9px;color:#777}
    .page{page-break-after:always}
    .page:last-child{page-break-after:auto}
    .pl-head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
    .pl-logo{width:64px;height:auto;flex:0 0 auto}
    .pl-marks{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
    .pl-wordmark{width:100%;max-width:360px;height:auto}
    .pl-title{width:34%;max-width:125px;height:auto}
    .pl-table{width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:0}
    .pl-table th{background:#fff;text-align:center;font-weight:600;font-size:9.5px;
      text-transform:none;letter-spacing:0;padding:3px 5px;border:1.6px solid #000}
    .pl-table td{padding:2px 5px;border-left:1.6px solid #000;border-right:1.6px solid #000;
      border-bottom:none;font-family:inherit;font-size:9.5px}
    .pl-table tbody tr:last-child td{border-bottom:1.6px solid #000}
    .pl-table td.num{text-align:right;font-variant-numeric:tabular-nums}
    .pl-table td.pl-code{white-space:nowrap}
    .pl-table thead{display:table-header-group}
    .pl-foot{margin-top:22px;font-size:10px;page-break-inside:avoid}
    .pl-dates{line-height:1.8;margin-bottom:24px}
    .pl-sigs{display:flex;gap:60px}
    .pl-sig{min-width:200px}
    .pl-party{font-weight:600;margin-bottom:30px}
    .pl-line{border-top:1px solid #000;width:100%}
  </style></head><body>${bodyHtml}</body></html>`;
  const old=document.getElementById('pdfFrame'); if(old) old.remove();
  const f=document.createElement('iframe');
  f.id='pdfFrame';
  f.setAttribute('aria-hidden','true');
  f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none';
  document.body.appendChild(f);
  const d=f.contentWindow.document;
  d.open(); d.write(html); d.close();
  const fire=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ console.error(e); toast('Could not open the print dialog — try the Print button instead'); } };
  if(d.readyState==='complete') setTimeout(fire,150); else f.onload=()=>setTimeout(fire,150);
}
function docHead(title, sub){
  return `<div class="doc-head"><div><h1>${esc(title)}</h1><div class="sub">${sub}</div></div>
    <div class="org"><b>Much Better Furniture</b><br>Generated ${fmtDate(todayISO())}</div></div>`;
}
function pmoney(n){ return n==null? '<span class="miss">not set</span>' : esc(money(n)); }
function pcls(v){ return v==null?'':v>0?'pos':v<0?'neg':''; }
function yuan(n){ return '¥ '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function usd(n){ return '$ '+Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* The full workings for one container, as printable markup. */
function pnlDetailDoc(r){
  const p=pnlProfit(r), m=pnlMonth(r);
  const lr=(l,v,cls)=>`<div class="r ${cls||''}"><span class="l">${l}</span><span class="v">${v}</span></div>`;
  const legacy = r.fwdUsd===undefined;   // records frozen before forwarding moved to USD
  return `<div class="page">
  ${docHead('P&L workings — '+(r.containerNo||'(no number)'),
    'Delivered '+fmtDateShort(r.deliveredAt)+' · '+esc(m.label)+' · '+esc(r.pol||'POL not set')+' · '+esc(r.containerType||'type not set')
    +' · figures frozen '+fmtDateShort(new Date(r.recalcAt||r.addedAt).toISOString().slice(0,10)))}
  ${r.issues && r.issues.length? `<div class="warn"><b>Excluded from report totals.</b>
    <ul>${r.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`:''}

  <h2>1 · Selling — invoice value excluding VAT</h2>
  <table><thead><tr><th class="num">Qty</th><th>Code</th><th class="num">Unit (R)</th><th class="num">Line total</th></tr></thead>
  <tbody>${r.lines.map(l=>`<tr><td class="num">${nf(l.qty)}</td><td>${esc(l.code)}</td>
    <td class="num">${l.sellUnit==null?'<span class="miss">no price</span>':esc(money(l.sellUnit))}</td>
    <td class="num">${l.sellTotal==null?'—':esc(money(l.sellTotal))}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="3">Selling total</td><td class="num">${esc(money(r.selling))}</td></tr></tfoot></table>
  ${r.sellingOverride!=null? `<div class="lines">${lr('Overridden with actual invoice figure', esc(money(r.sellingOverride)),'tot')}</div>`:''}

  <h2>2 · Goods cost — RMB converted to rand</h2>
  <table><thead><tr><th class="num">Qty</th><th>Code</th><th class="num">Unit (¥)</th><th class="num">Line total (¥)</th></tr></thead>
  <tbody>${r.lines.map(l=>`<tr><td class="num">${nf(l.qty)}</td><td>${esc(l.code)}${l.mixedRmb?' (mixed)':''}</td>
    <td class="num">${l.rmbUnit==null?'<span class="miss">no RMB price</span>':esc(yuan(l.rmbUnit))}</td>
    <td class="num">${l.rmbTotal==null?'—':esc(yuan(l.rmbTotal))}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td colspan="3">RMB total</td><td class="num">${esc(yuan(r.rmbTotal))}</td></tr></tfoot></table>
  <div class="lines">${lr('RMB total ÷ RMB-to-Rand rate ('+(r.roe==null?'<span class="miss">not set</span>':r.roe)+')',
    r.goodsZar==null?'—':esc(money(r.goodsZar)),'tot')}</div>

  <h2>3 · Landed cost</h2>
  <div class="lines">
    ${lr('Goods (from step 2)', r.goodsZar==null?'—':esc(money(r.goodsZar)))}
    ${lr('Clearing', pmoney(r.clearing))}
    ${lr('Transport', pmoney(r.transport))}
    ${legacy? lr(esc(r.fwdLabel), pmoney(r.fwd)) : `
      ${lr(esc(r.fwdLabel)+' (quoted in USD)', r.fwdUsd==null?'<span class="miss">not set</span>':esc(usd(r.fwdUsd)),'ind')}
      ${lr('× RMB-to-USD rate ('+(r.rmbToUsd==null?'<span class="miss">not set</span>':r.rmbToUsd)+')', r.fwdRmb==null?'—':esc(yuan(r.fwdRmb)),'ind')}
      ${lr('÷ RMB-to-Rand rate ('+(r.roe==null?'<span class="miss">not set</span>':r.roe)+')', pmoney(r.fwd))}`}
    ${lr('Total cost', r.cost==null?'—':esc(money(r.cost)),'tot')}
  </div>

  <h2>4 · Result</h2>
  <div class="lines">
    ${lr('Selling (excl VAT)', esc(money(pnlSelling(r))))}
    ${lr('Less cost', r.cost==null?'—':'− '+esc(money(r.cost)))}
    ${lr('Profit / Loss', p==null?'—':'<span class="'+pcls(p)+'">'+esc(money(p))+'</span>','tot')}
    ${lr('Margin on selling', '<span class="'+pcls(p)+'">'+pct(pnlMargin(r))+'</span>')}
  </div>
  <div class="foot">Selling figures exclude VAT. Exchange rates and charges are those stored on this container when it was added to the P&amp;L.</div>
  </div>`;
}
function printPnlDetail(containerId){
  const r=pnlRec(containerId); if(!r){ toast('Not in the P&L'); return; }
  printDoc('P&L workings - '+(r.containerNo||'container'), pnlDetailDoc(r), false);
}

/* The summary report, optionally with every container's workings appended. */
function printPnlReport(withWorkings){
  const {rows,tot}=pnlRows();
  if(!rows.length){ toast('Nothing to save'); return; }
  const scope = pnlState.month==='all'? 'All months' : pnlState.month;
  const kpi=(k,v,cls)=>`<div class="kpi"><div class="k">${k}</div><div class="v ${cls||''}">${v}</div></div>`;
  let body=`<div class="page">
  ${docHead('Profit & Loss', esc(scope)+' · selling excludes VAT')}
  <div class="kpis">
    ${kpi('Containers', nf(tot.counted)+(tot.excluded?' of '+nf(tot.n):''))}
    ${kpi('Selling', esc(money(tot.selling)))}
    ${kpi('Cost', esc(money(tot.cost)))}
    ${kpi('Profit / Loss', esc(money(tot.profit)), pcls(tot.profit))}
    ${kpi('Margin', pct(tot.margin), pcls(tot.profit))}
  </div>
  ${tot.excluded? `<div class="warn"><b>${nf(tot.excluded)} container${tot.excluded===1?'':'s'} left out of the totals</b> — a figure needed for the cost is missing. Marked “incomplete” below.</div>`:''}
  <table><thead><tr><th>Container</th><th>Delivered</th><th>Month</th><th>POL</th><th>Type</th>
    <th class="num">Selling</th><th class="num">Cost</th><th class="num">Profit / Loss</th><th class="num">Margin</th></tr></thead>
  <tbody>${rows.map(({r,m})=>{ const p=pnlProfit(r);
    return `<tr><td><b>${esc(r.containerNo||'(no number)')}</b>${r.complete?'':' <span class="miss">incomplete</span>'}${r.sellingOverride!=null?' (manual)':''}</td>
    <td>${fmtDateShort(r.deliveredAt)}</td><td>${esc(m.label)}</td><td>${esc(r.pol||'—')}</td><td>${esc(r.containerType||'—')}</td>
    <td class="num">${esc(money(pnlSelling(r)))}</td>
    <td class="num">${r.cost==null?'—':esc(money(r.cost))}</td>
    <td class="num ${pcls(p)}">${p==null?'—':esc(money(p))}</td>
    <td class="num ${pcls(p)}">${pct(pnlMargin(r))}</td></tr>`;}).join('')}</tbody>
  <tfoot><tr><td colspan="5">Total${tot.excluded?' (complete containers only)':''}</td>
    <td class="num">${esc(money(tot.selling))}</td><td class="num">${esc(money(tot.cost))}</td>
    <td class="num ${pcls(tot.profit)}">${esc(money(tot.profit))}</td>
    <td class="num ${pcls(tot.profit)}">${pct(tot.margin)}</td></tr></tfoot></table>
  <div class="foot">Selling figures exclude VAT. Each container uses the exchange rates and charges stored when it was added to the P&amp;L.</div>
  </div>`;
  if(withWorkings) body += rows.map(({r})=>pnlDetailDoc(r)).join('');
  printDoc('Profit and Loss - '+scope+(withWorkings?' with workings':''), body, true);
}

/* ---------- PRICE LIST REPORT ----------
   Laid out to match the Much Better Price List workbook: letterhead, bordered
   Code / Description / RMB / ZAR table, then date, validity and signature blocks. */
let priceListState={search:'', onlyPriced:false};
function plSettings(){
  if(!state.settings.priceList) state.settings.priceList={date:'', validity:'', partyA:'Much Better Furniture', partyB:'Fair Price Furniture'};
  const s=state.settings.priceList;
  if(s.partyA===undefined) s.partyA='Much Better Furniture';
  if(s.partyB===undefined) s.partyB='Fair Price Furniture';
  return s;
}
function plSet(k,v){ plSettings()[k]=v; save(); }
function plDateText(){ const s=plSettings(); return s.date && s.date.trim()? s.date.trim() : fmtDate(todayISO()); }
function plValidityText(){ return (plSettings().validity||'').trim(); }
function priceListRows(){
  const q=priceListState.search.trim().toLowerCase();
  let rows=state.products.slice().sort(byCodeSort);
  if(q) rows=rows.filter(p=>((p.code||'')+' '+(p.description||'')).toLowerCase().includes(q));
  if(priceListState.onlyPriced) rows=rows.filter(p=>numOrNull(p.price)!=null || numOrNull(p.rmbPrice)!=null);
  return rows;
}
function priceListSearch(v){
  priceListState.search=v;
  const b=document.getElementById('plBody'); if(b) b.innerHTML=priceListBody();
  const c=document.getElementById('plCount'); if(c){ const n=priceListRows().length; c.textContent=nf(n)+' item'+(n===1?'':'s'); }
}
function priceListToggle(){ priceListState.onlyPriced=!priceListState.onlyPriced; render(); }

/* ---------- WAREHOUSE (On Water lines) ---------- */
/* Month label a line is bucketed into — either its expected delivery month or its order month */
function whsMonthKey(o,c,basis){
  if(basis==='order') return {iso:o.periodISO||'', label:o.period||'(no month)'};
  const d=expDelivOf(c);
  if(!d) return {iso:'', label:'(no ETA)'};
  return {iso:d.toISOString().slice(0,7), label:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
}
function warehouseRows(){
  const f=filters.warehouse;
  const all=[];
  state.containers.filter(c=>c.status==='On Water').forEach(c=>{ (c.lines||[]).forEach(l=>{
    const o=order(l.orderId)||{}; all.push({o,c,l,m:whsMonthKey(o,c,f.basis)}); }); });
  // ETA order, then keep every container's lines together
  all.sort((a,b)=>{ const ea=a.c.eta?+new Date(a.c.eta):Infinity, eb=b.c.eta?+new Date(b.c.eta):Infinity;
    return ea-eb || String(a.c.id).localeCompare(String(b.c.id)); });
  const months=[...new Map(all.map(r=>[r.m.label,r.m])).values()]
    .sort((a,b)=> String(a.iso||'9999').localeCompare(String(b.iso||'9999')));
  const rows = f.month==='all'? all : all.filter(r=>r.m.label===f.month);
  return {rows, all, months};
}

/* ---------- BUYER REPORT (by factory) ---------- */
function buyerExpDeliv(o){
  // earliest expected delivery among this order's still-on-water shipments
  let best=null;
  state.containers.forEach(c=>{ if(c.status!=='On Water') return;
    if(!(c.lines||[]).some(l=>l.orderId===o.id)) return; const e=expDelivOf(c);
    if(e && (!best||e<best)) best=e; });
  return best;
}
function buyerLate(o){
  // schedule slippage: expected delivery (from the container's ETA) vs the order's planned ETA
  if(!o.plannedEta) return null;            // no plan captured on the order
  const exp=buyerExpDeliv(o); if(!exp) return null;   // not on a container yet — nothing to compare
  const planned=new Date(o.plannedEta+'T00:00:00');
  return Math.round((exp - planned)/86400000);   // >0 = arriving later than planned (late)
}
function buyerMonths(){
  return [...new Set(state.orders.map(o=>o.period).filter(Boolean))]
    .sort((a,b)=>{ const oa=state.orders.find(o=>o.period===a), ob=state.orders.find(o=>o.period===b);
      return String(ob.periodISO||'').localeCompare(String(oa.periodISO||'')); });
}

/* ---------- INVOICE ---------- */
function money(n){ return 'R ' + (Number(n)||0).toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function productByCode(code){ if(!code) return null;
  let p=state.products.find(x=>x.code===code);
  if(!p){ const up=String(code).toUpperCase(); p=state.products.find(x=>String(x.code).toUpperCase()===up); }
  return p||null; }
function lookupPrice(code){ const p=productByCode(code); return p?{d:p.description, p:p.price}:null; }
function resolveLinePrice(o){
  if(o && o.price!=null && o.price!=='' && isFinite(o.price)) return Number(o.price);
  const p=productByCode(o?o.code:''); return (p && p.price!=null && p.price!=='' && isFinite(p.price))? Number(p.price): null;
}
function itemsFromContainer(c){
  const agg={};
  (c.lines||[]).forEach(l=>{ const o=order(l.orderId)||{}; const code=o.code||'?';
    const price=resolveLinePrice(o);
    const key=code+'|'+(price==null?'_':price);
    if(!agg[key]) agg[key]={code, price, qty:0, periods:[], pos:[]};
    agg[key].qty+=l.qty;
    if(o.period && !agg[key].periods.includes(o.period)) agg[key].periods.push(o.period);
    if(o.po && !agg[key].pos.includes(o.po)) agg[key].pos.push(o.po);
  });
  return Object.values(agg).sort((x,y)=> x.code===y.code ? ((x.price||0)-(y.price||0)) : String(x.code).localeCompare(String(y.code)))
    .map(a=>({code:a.code, qty:a.qty, price:a.price, periods:a.periods, pos:a.pos}));
}
function poFromItems(items){ return [...new Set((items||[]).flatMap(it=>it.pos||[]).filter(Boolean))].join(', '); }
function nextInvNo(){ const y=new Date().getFullYear(); state.settings.invSeq=(state.settings.invSeq||56)+1; return 'INV'+y+String(state.settings.invSeq).padStart(3,'0'); }

function generateInvoice(containerId){
  const c=container(containerId); if(!c) return;
  const items=itemsFromContainer(c);
  invoiceCtx = { containerId, invNo:nextInvNo(), date:todayISO(), contNo:c.containerNo||'—', poNo:poFromItems(items), showPo:true, items };
  save(); go('invoice'); toast('Invoice generated from '+(c.containerNo||'container'));
}

function renderInvoiceItems(){

/* -- normalized values per column, used for both the filter dropdown and each row's data-col-* attributes -- */
function getColValues(p,key){
  if(key==='code') return [p.code || '(blank)'];
  if(key==='description') return [p.description || '(blank)'];
  if(key==='factory') return [p.factory || '(none)'];
  if(key==='price') return [p.price!=null && p.price!=='' ? ('R'+Number(p.price).toFixed(2)) : '(no price)'];
  if(key==='rmbPrice') return [p.rmbPrice!=null && p.rmbPrice!=='' ? ('¥'+Number(p.rmbPrice).toFixed(2)) : '(no price)'];
  if(key==='profiles') return (p.profiles && p.profiles.length) ? p.profiles.slice() : ['(none)'];
  return [''];
}
function distinctColValues(key){
  const set=new Set();
  (state.products||[]).forEach(p=>getColValues(p,key).forEach(v=>set.add(v)));
  return Array.from(set).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
}
function sortedProductIndices(){
  const idxs=state.products.map((_,i)=>i);
  const s=prodFilterState.sort;
  if(!s.col) return idxs;
  const dir=s.dir;
  const val=p=>{
    if(s.col==='price') return p.price!=null && p.price!=='' ? Number(p.price) : null;
    if(s.col==='rmbPrice') return p.rmbPrice!=null && p.rmbPrice!=='' ? Number(p.rmbPrice) : null;
    if(s.col==='profiles') return (p.profiles||[]).join(', ');
    return (p[s.col]||'').toString();
  };
  idxs.sort((a,b)=>{
    const va=val(state.products[a]), vb=val(state.products[b]);
    if(va==null && vb==null) return 0;
    if(va==null) return 1;
    if(vb==null) return -1;
    if(typeof va==='number' && typeof vb==='number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb),undefined,{numeric:true,sensitivity:'base'})*dir;
  });
  return idxs;
}
function sortProducts(key){
  const s=prodFilterState.sort;
  if(s.col===key) s.dir=-s.dir; else { s.col=key; s.dir=1; }
  render();
}

/* -- combined text search + per-column value filters; toggles row visibility without a full re-render -- */
function filterProducts(){
  const el=document.getElementById('prodSearch');
  const q=(el?el.value:(prodFilterState.search||'')).toLowerCase().trim();
  prodFilterState.search=q;
  document.querySelectorAll('#prod-table tr').forEach(tr=>{

      }
    }

/* -- Excel-style column filter dropdown -- */
function toggleColFilter(ev,key){
  ev.stopPropagation();
  const old=document.getElementById('colfilter-pop');
  const wasKey=old?old.dataset.key:null;
  closeColFilterPop();
  if(wasKey===key) return; // clicking the same funnel again just closes it

  const btn=ev.currentTarget;
  const rect=btn.getBoundingClientRect();
  const values=distinctColValues(key);
  const active=prodFilterState.col[key];

  const pop=document.createElement('div');
  pop.className='col-filter-pop'; pop.id='colfilter-pop'; pop.dataset.key=key;
  pop.addEventListener('mousedown',e=>e.stopPropagation());

  const search=document.createElement('input');
  search.type='text'; search.placeholder='Search values…';
  pop.appendChild(search);

  const actionsTop=document.createElement('div'); actionsTop.className='col-filter-actions';
  const selAllBtn=document.createElement('button'); selAllBtn.type='button'; selAllBtn.textContent='Select all';
  const clearBtn=document.createElement('button'); clearBtn.type='button'; clearBtn.textContent='Clear';
  actionsTop.append(selAllBtn,clearBtn);
  pop.appendChild(actionsTop);

  const list=document.createElement('div'); list.className='col-filter-list';
  values.forEach(v=>{
    const lab=document.createElement('label'); lab.className='col-filter-item'; lab.dataset.val=v.toLowerCase();
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked = !active || active.has(v);
    cb.addEventListener('change',()=>{
      let a=prodFilterState.col[key];
      if(!a) a=new Set(values);
      if(cb.checked) a.add(v); else a.delete(v);
      prodFilterState.col[key] = (a.size===values.length) ? null : a;
      btn.classList.toggle('active', !!prodFilterState.col[key]);
      filterProducts();
    });
    const span=document.createElement('span'); span.textContent=v;
    lab.append(cb,span);
    list.appendChild(lab);
  });
  pop.appendChild(list);

  search.addEventListener('input',()=>{
    const sq=search.value.toLowerCase().trim();
    list.querySelectorAll('.col-filter-item').forEach(it=>{ it.style.display = !sq || it.dataset.val.includes(sq) ? '' : 'none'; });
  });
  selAllBtn.addEventListener('click',()=>{
    prodFilterState.col[key]=null;
    list.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=true);
    btn.classList.remove('active'); filterProducts();
  });
  clearBtn.addEventListener('click',()=>{
    prodFilterState.col[key]=new Set();
    list.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
    btn.classList.add('active'); filterProducts();
  });

  document.body.appendChild(pop);
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let top=rect.bottom+4, left=rect.right-pw;
  if(left<8) left=8;
  if(top+ph>window.innerHeight-8) top=rect.top-ph-4;
  pop.style.top=top+'px'; pop.style.left=left+'px';

  setTimeout(()=>document.addEventListener('mousedown',closeColFilterOnOutsideClick,true),0);
}
function closeColFilterOnOutsideClick(e){
  const pop=document.getElementById('colfilter-pop');
  if(pop && !pop.contains(e.target)) closeColFilterPop();
}
function closeColFilterPop(){
  const pop=document.getElementById('colfilter-pop');
  if(pop) pop.remove();
  document.removeEventListener('mousedown',closeColFilterOnOutsideClick,true);
}

/* ---------- FACTORY RENAME ----------
   The factory name is snapshotted onto each order when it is created, so editing the
   product list alone leaves old orders (and the containers that read from them) on the
   previous name. Changing it here asks what was meant: renaming the factory itself, or
   moving just this one product to a different factory. */
function factoryEdited(i, el){
  const p=state.products[i]; if(!p) return;
  const oldName=String(el.dataset.orig||'').trim();
  const newName=String(el.value||'').trim();
  p.factory=el.value; save();
  el.dataset.orig=el.value;
  if(!oldName || !newName || oldName===newName){ fillFactoryList(); return; }

  const norm=v=>String(v||'').trim();
  const otherProducts=state.products.filter((q,j)=>j!==i && norm(q.factory)===oldName);
  const oldOrders=state.orders.filter(o=>norm(o.factory)===oldName);
  const thisCodeOrders=oldOrders.filter(o=>norm(o.code)===norm(p.code));
  if(!oldOrders.length && !otherProducts.length){ fillFactoryList(); render(); return; }

  openFactoryRenameModal({i, oldName, newName,
    others:otherProducts.length, allOrders:oldOrders.length, codeOrders:thisCodeOrders.length,
    code:p.code||'this product'});
}

function factoryRenameApply(mode, i, oldName, newName){
  const p=state.products[i];
  const norm=v=>String(v||'').trim();
  let n=0;
  if(mode==='undo'){
    if(p) p.factory=oldName;
    save(); closeModal(); render(); toast('Reverted to '+oldName); return;
  }
  if(mode==='all'){
    state.orders.forEach(o=>{ if(norm(o.factory)===oldName){ o.factory=newName; n++; } });
    state.products.forEach((q,j)=>{ if(j!==i && norm(q.factory)===oldName) q.factory=newName; });
  } else if(mode==='code'){
    const code=norm(p?p.code:'');
    state.orders.forEach(o=>{ if(norm(o.factory)===oldName && norm(o.code)===code){ o.factory=newName; n++; } });
  }
  save(); closeModal(); fillFactoryList(); render();
  toast(mode==='none'? 'Product list updated \u2014 existing orders unchanged'
                     : 'Updated '+nf(n)+' order'+(n===1?'':'s'));
}

function toggleProdPaste(){ const ta=document.getElementById('prodPaste'); if(!ta) return;
  const show=ta.style.display==='none'; ta.style.display=show?'block':'none'; if(show) ta.focus(); }
function parseProductPaste(text){
  text=text.replace(/\r/g,''); const lines=text.split('\n').filter(l=>l.trim().length); if(!lines.length) return null;
  const d=lines[0].indexOf('\t')>=0?'\t':','; const grid=lines.map(l=>splitLine(l,d).map(s=>s.trim()));
  const head=grid[0].map(s=>s.toLowerCase().replace(/[^a-z]/g,''));
  const hasHeader=head.some(h=>['code','description','desc','factory','price','cost','profile','profiles','colour','color','colours','colors','rmb','rmbprice','pricermb','cny','yuan'].includes(h));
  let cC=-1,dC=-1,prC=-1,fC=-1,pC=-1,rC=-1,start=0;
  if(hasHeader){ start=1; head.forEach((h,i)=>{
    if(cC<0&&h==='code')cC=i;
    if(dC<0&&(h==='description'||h==='desc'))dC=i;
    if(prC<0&&['profile','profiles','colour','color','colours','colors'].includes(h))prC=i;
    if(fC<0&&h==='factory')fC=i;
    if(pC<0&&(h==='price'||h==='cost'))pC=i;
    if(rC<0&&['rmb','rmbprice','pricermb','cny','yuan'].includes(h))rC=i; }); }
  if(cC<0){ // positional fallback: code first, then sensible defaults by column count
    const n=grid[start]?grid[start].length:0; cC=0;
    if(n>=6){ dC=1; prC=2; fC=3; pC=4; rC=5; }
    else if(n===5){ dC=1; prC=2; fC=3; pC=4; }
    else if(n===4){ dC=1; fC=2; pC=3; }
    else if(n===3){ dC=1; pC=2; }
    else if(n===2){ dC=1; }
  }
  if(cC<0) return {error:true};
  const out=[];
  for(let r=start;r<grid.length;r++){ const row=grid[r]; const code=(row[cC]||'').trim(); if(!code) continue;
    const description=dC>=0?(row[dC]||'').trim():'';
    const factory=fC>=0?(row[fC]||'').trim():'';
    let price=null; if(pC>=0){ const raw=String(row[pC]||'').replace(/[^0-9.\-]/g,''); if(raw!==''){ const v=parseFloat(raw); if(isFinite(v)) price=v; } }
    let rmbPrice=null; if(rC>=0){ const raw=String(row[rC]||'').replace(/[^0-9.\-]/g,''); if(raw!==''){ const v=parseFloat(raw); if(isFinite(v)) rmbPrice=v; } }
    let profiles=[]; if(prC>=0 && row[prC]) profiles=row[prC].split(/[,;/|]+/).map(s=>s.trim()).filter(Boolean);
    out.push({code, description, factory, price, rmbPrice, profiles});
  }
  return {rows:out};
}
function applyProductPaste(){
  const ta=document.getElementById('prodPaste'); const text=ta?ta.value:''; if(!text.trim()){ toast('Nothing to paste yet'); return; }
  const res=parseProductPaste(text);
  if(!res){ toast('Could not read the pasted text'); return; }
  if(res.error||!res.rows.length){ toast('Could not find product rows — include a header row, or put Code in the first column'); return; }
  let added=0,updated=0;
  res.rows.forEach(r=>{
    const ex=state.products.find(p=>String(p.code).toLowerCase()===r.code.toLowerCase());
    if(ex){
      if(r.description) ex.description=r.description;
      if(r.factory) ex.factory=r.factory;
      if(r.price!=null) ex.price=r.price;
      if(r.rmbPrice!=null) ex.rmbPrice=r.rmbPrice;
      if(r.profiles&&r.profiles.length){ ex.profiles=ex.profiles||[];
        r.profiles.forEach(pr=>{ if(!ex.profiles.some(x=>x.toLowerCase()===pr.toLowerCase())) ex.profiles.push(pr); }); }
      updated++;
    } else {
      state.products.push({code:r.code, description:r.description||'', factory:r.factory||'', price:r.price!=null?r.price:null, rmbPrice:r.rmbPrice!=null?r.rmbPrice:null, profiles:r.profiles||[]});
      added++;
    }
  });

  toast(added+' added · '+updated+' updated');
}

  if(codeC<0||qtyC<0){
    const cols=grid[start]?grid[start].length:0, sc=[];
    for(let c=0;c<cols;c++){ let code=0,nums=0; for(let r=start;r<grid.length;r++){ const v=grid[r][c]; if(!v)continue; if(codePat.test(v))code++; if(numPat.test(v))nums++; } sc.push({code,nums}); }
    const best=(key,ex)=>{ let bi=-1,bv=0; for(let i=0;i<sc.length;i++){ if(ex.includes(i))continue; if(sc[i][key]>bv){bv=sc[i][key];bi=i;} } return bv>0?bi:-1; };
    if(codeC<0)codeC=best('code',[]);
    if(qtyC<0)qtyC=best('nums',[codeC]);
    if(profC<0){ for(let c=0;c<cols;c++){ if(c===codeC||c===qtyC)continue; let txt=0; for(let r=start;r<grid.length;r++){ const v=grid[r][c]; if(v&&!numPat.test(v)&&!codePat.test(v))txt++; } if(txt){profC=c;break;} } }
  }
  if(codeC<0||qtyC<0) return {error:true};
  const out=[];
  for(let r=start;r<grid.length;r++){ const row=grid[r]; const code=(row[codeC]||'').trim(); if(!code||!codePat.test(code)) continue;
    let qty=parseFloat(String(row[qtyC]||'').replace(/[, ]/g,'')); if(!isFinite(qty)||qty<=0) continue;
    const profile=profC>=0?(row[profC]||'').trim():''; const p=productByCode(code);
    const factory=(factC>=0&&row[factC])?row[factC].trim():(p?p.factory:'');
    let price=null; if(priceC>=0){ const raw=String(row[priceC]||'').replace(/[^0-9.\-]/g,''); if(raw!==''){ const v=parseFloat(raw); if(isFinite(v)) price=v; } }
    if(price==null && p && p.price!=null && p.price!=='' && isFinite(p.price)) price=Number(p.price);
    let rmbPrice=null; if(p && p.rmbPrice!=null && p.rmbPrice!=='' && isFinite(p.rmbPrice)) rmbPrice=Number(p.rmbPrice);
    out.push({code, profile, qty, factory, price, rmbPrice, description:p?p.description:''});
  }
  return {lines:out};
}

function deleteOrder(id){

function cancelBalance(id){ const o=order(id); const s=orderStats(o);
  if(s.inProduction<=0){ toast('Nothing in production to cancel'); return; }

function restoreBalance(id){ const o=order(id); o.cancelled=0; save(); render(); openOrderDetail(id); toast('Balance restored'); }
/* Close off a whole PO: write off every unit still in production so the PO drops out of the active list.
   Nothing is deleted — the lines, quantities and shipments all stay on record. */
function closeOffGroup(key){
  const g=orderGroups().find(x=>x.key===key); if(!g){ toast('PO not found'); return; }
  const open=g.orders.map(o=>({o,s:orderStats(o)})).filter(r=>r.s.inProduction>0);
  if(!open.length){ toast('Nothing left in production on this PO'); return; }
  const tot=open.reduce((a,r)=>a+r.s.inProduction,0);
  if(!confirm('Close off '+(g.po||'this PO')+' short by '+nf(tot)+' unit'+(tot===1?'':'s')+'?\n\n'+
    open.map(r=>'  '+r.o.code+(r.o.profile?' · '+r.o.profile:'')+' — '+nf(r.s.inProduction)+' never shipped').join('\n')+
    '\n\nNothing is deleted. The lines stay on record and the PO simply stops counting as active. You can reopen it at any time.')) return;
  open.forEach(r=>{ r.o.cancelled=(r.o.cancelled||0)+r.s.inProduction; });
  save(); render(); toast('PO closed off · '+nf(tot)+' unit'+(tot===1?'':'s')+' written off');
}
function reopenGroup(key){
  const g=orderGroups().find(x=>x.key===key); if(!g){ toast('PO not found'); return; }
  const n=g.orders.filter(o=>(o.cancelled||0)>0);
  if(!n.length){ toast('Nothing written off on this PO'); return; }
  const tot=n.reduce((a,o)=>a+(o.cancelled||0),0);
  if(!confirm('Reopen '+(g.po||'this PO')+'? '+nf(tot)+' written-off unit'+(tot===1?'':'s')+' will go back to outstanding.')) return;
  n.forEach(o=>{ o.cancelled=0; });
  expandedOrderGroups.add(key);
  save(); render(); toast('PO reopened');
}

/* Single comparator so every PO list stays in the same oldest-to-newest order */
function cmpGroupOldestFirst(a,b){
  const ma=String(a.periodISO||'9999-99'), mb=String(b.periodISO||'9999-99');
  if(ma!==mb) return ma.localeCompare(mb);
  return Math.min(...a.orders.map(o=>o.createdAt||0)) - Math.min(...b.orders.map(o=>o.createdAt||0));
}
function orderGroups(){
  const map={};
  state.orders.forEach(o=>{ const k=o.orderGroup||o.id;
    (map[k]=map[k]||{key:k,po:o.po||'',period:o.period||'',periodISO:o.periodISO||'',orders:[]}).orders.push(o); });
  return Object.values(map).sort(cmpGroupOldestFirst);
}
function groupLabel(g){ const avail=g.orders.reduce((a,o)=>a+orderStats(o).inProduction,0);
  /* Count only the lines that still have something to load, so the label matches the rows below it. */
  const live=g.orders.filter(o=>orderStats(o).inProduction>0).length;
  return (g.po||'No PO')+' · '+(g.period||'—')+'  —  '+live+' line'+(live===1?'':'s')+', '+nf(avail)+' to pack'; }
/* Orders with nothing left to load (all shipped, or on water) are hidden from the picker,
   since selecting them can only ever produce a zero line. packAvail already counts what is
   on THIS container, so an item already loaded here still shows a positive figure. */
function packGroupAvail(g){ return (g.orders||[]).reduce((a,o)=>a+packAvail(o.id),0); }
function packPickableGroups(){
  const all=orderGroups();
  if(packPick && packPick.showAll) return all;
  const live=all.filter(g=>packGroupAvail(g)>0);
  /* Keep the group currently being viewed on screen even if it just emptied out,
     otherwise the dropdown jumps around mid-edit. */
  if(packPick && packPick.group && !live.some(g=>g.key===packPick.group)){
    const cur=all.find(g=>g.key===packPick.group); if(cur) return live.concat([cur]);
  }
  return live;
}

  else setTimeout(()=>{ const el=document.getElementById('c_no'); if(el) el.focus(); },60);
}
function setPackShipType(type){
  const seg=document.getElementById('c_shipSeg'); if(!seg) return;

function copyShipmentDetails(){

    vessel:val('c_vessel'), line:val('c_line'), loadDate:val('c_load')||null,
    pol:val('c_pol')||'', containerType:val('c_ctype')||'',

    shipType: val('c_shipType')||'direct',

  };

function pasteShipmentDetails(){

function renderPackLines(){
  const box=document.getElementById('packLinesBox'); if(!box) return;
  const valid=packLines.filter(p=>p.orderId && +p.qty>0);
  if(!valid.length){ box.innerHTML='<div class="minor" style="font-size:12.5px;padding:10px 2px;border:1px dashed var(--line);border-radius:9px;text-align:center">No stock yet — click “Add from order” to choose items.</div>';
    const t=document.getElementById('packTotal'); if(t) t.textContent='0'; return; }
  const groups={}; valid.forEach(p=>{ const o=order(p.orderId); const gk=o?(o.orderGroup||o.id):'?'; (groups[gk]=groups[gk]||[]).push(p); });
  let html='<div class="pack-list">';
  Object.keys(groups).forEach(gk=>{ const first=order(groups[gk][0].orderId);
    const sub=groups[gk].reduce((a,p)=>a+(+p.qty||0),0);
    html+='<div class="pack-grp">'+esc(first?((first.po||'No PO')+' · '+first.period):'')+' <span style="float:right;color:var(--txt-3)">'+nf(sub)+' units</span></div>';
    groups[gk].forEach(p=>{ const o=order(p.orderId)||{}; html+=`<div class="pack-line-row">
      <div style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span class="mono" style="font-weight:600">${esc(o.code||'?')}</span> · ${esc(o.profile||'—')} <span class="minor" style="font-size:11px">${esc(o.description||'')}</span></div>
      <span class="mono" style="font-weight:600">${nf(p.qty)}</span>
      <button class="x" onclick="packRemoveLine('${p.orderId}')" title="Remove">×</button></div>`; });
  });
  html+='</div>';
  box.innerHTML=html;
  const t=document.getElementById('packTotal'); if(t) t.textContent=nf(valid.reduce((a,p)=>a+(+p.qty||0),0));
}
function packRemoveLine(orderId){ packLines=packLines.filter(p=>p.orderId!==orderId); renderPackLines(); }
function packAddFromOrder(focusGroup, focusOrderId){
  if(!orderGroups().length){ toast('Add an order first'); return; }
  packPick={group:null,q:'',sel:{},focusOrderId:focusOrderId||null,showAll:false};
  /* Jumping in from a specific order: show everything, so the order asked for is definitely there. */
  if(focusGroup && packGroupAvail(orderGroups().find(g=>g.key===focusGroup)||{orders:[]})<=0) packPick.showAll=true;
  const groups=packPickableGroups();
  if(!groups.length){ toast('Every order is fully loaded — nothing left to pack'); return; }
  document.getElementById('packScreenList').style.display='none';
  document.getElementById('packFoot').style.display='none';
  document.getElementById('packScreenPick').style.display='block';
  const start=(focusGroup && groups.some(g=>g.key===focusGroup))? focusGroup : groups[0].key;
  packPick.group=start;
  renderPackGroupSel();
  packChooseGroup(start);
  setTimeout(()=>{ const s=document.getElementById('packItemSearch'); if(s&&!focusOrderId) s.focus(); },40);
}
function packBackToList(){
  document.getElementById('packScreenPick').style.display='none';
  document.getElementById('packScreenList').style.display='block';
  document.getElementById('packFoot').style.display='flex';
  renderPackLines();
}
function renderPackGroupSel(){
  const sel=document.getElementById('packGroupSel'); if(!sel) return;
  const groups=packPickableGroups();
  sel.innerHTML=groups.map(g=>{ const left=packGroupAvail(g);
    return `<option value="${g.key}">${esc(groupLabel(g))}${left>0?'':' — fully loaded'}</option>`; }).join('');
  sel.value=packPick.group;
  const hidden=orderGroups().length-groups.length;
  const note=document.getElementById('packHiddenNote');
  if(note) note.innerHTML = packPick.showAll
    ? `Showing every order. <a href="#" onclick="packToggleShowAll();return false;">Hide fully loaded</a>`
    : (hidden>0? `${nf(hidden)} fully loaded PO${hidden===1?'':'s'} hidden. <a href="#" onclick="packToggleShowAll();return false;">Show all</a>` : '');
}
function packToggleShowAll(){
  packPick.showAll=!packPick.showAll;
  const groups=packPickableGroups();
  if(!groups.some(g=>g.key===packPick.group) && groups.length) packPick.group=groups[0].key;
  renderPackGroupSel(); renderPackItems();
}
function packChooseGroup(key){
  packPick.group=key; packPick.sel={};
  const g=orderGroups().find(x=>x.key===key); if(!g) return;
  g.orders.forEach(o=>{ const ex=packLines.find(p=>p.orderId===o.id); if(ex) packPick.sel[o.id]=ex.qty; });
  if(packPick.focusOrderId){ packPick.sel[packPick.focusOrderId]=packAvail(packPick.focusOrderId); packPick.focusOrderId=null; }
  const si=document.getElementById('packItemSearch'); if(si) si.value=''; packPick.q='';
  renderPackItems();
}
function renderPackItems(){
  const box=document.getElementById('packItemsBox'); if(!box) return;
  const g=orderGroups().find(x=>x.key===packPick.group); if(!g){ box.innerHTML=''; return; }
  const q=(packPick.q||'').toLowerCase();
  let items=g.orders.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true})||String(a.profile||'').localeCompare(String(b.profile||'')));
  const totalItems=items.length;
  /* Nothing left to load — already shipped or on water. Keep it if it is selected on this container. */
  if(!packPick.showAll) items=items.filter(o=>packAvail(o.id)>0 || packPick.sel[o.id]!==undefined);
  const hiddenItems=totalItems-items.length;
  if(q) items=items.filter(o=>(o.code+' '+(o.profile||'')+' '+(o.description||'')).toLowerCase().includes(q));
  box.innerHTML='<div class="pick-head"><span></span><span>Item</span><span>Profile</span><span style="text-align:right">Avail</span><span style="text-align:right">Qty</span></div>'+
    (items.map(o=>{ const sel=packPick.sel[o.id]!==undefined; const avail=packAvail(o.id);
      return `<div class="pick-row ${sel?'sel':''}">
        <input type="checkbox" ${sel?'checked':''} onchange="packToggle('${o.id}',this.checked,this)">
        <div style="min-width:0"><div class="pcode">${esc(o.code)}</div><div class="pdesc">${esc(o.description||'')}${o.orderQty?' · ord '+nf(o.orderQty):''}</div></div>
        <div style="font-size:12px">${esc(o.profile||'—')}</div>
        <div class="prem">${nf(avail)}</div>
        <input type="number" min="0" placeholder="0" value="${sel?packPick.sel[o.id]:''}" oninput="packQty('${o.id}',this.value,this)">
      </div>`; }).join('') || `<div class="minor" style="padding:16px;text-align:center;font-size:12.5px">${
        q? 'No items match.' : (hiddenItems? 'Every item on this PO is already loaded or on water.' : 'No items on this PO.')}</div>`)
    + (hiddenItems && !q? `<div class="minor" style="padding:8px 12px;font-size:11.5px;text-align:center;border-top:1px solid var(--line)">${nf(hiddenItems)} item${hiddenItems===1?'':'s'} hidden — nothing left to load. <a href="#" onclick="packToggleShowAll();return false;">Show all</a></div>`:'');
  renderPackGroupSel();
  updatePackPickCount();
}
function packToggle(orderId,checked,cbEl){
  const row=cbEl.closest('.pick-row'); const qi=row?row.querySelector('input[type=number]'):null;
  if(checked){ const a=packAvail(orderId); packPick.sel[orderId]=a; if(qi) qi.value=a; }
  else { delete packPick.sel[orderId]; if(qi) qi.value=''; }
  if(row) row.classList.toggle('sel',checked); updatePackPickCount();
}
function packQty(orderId,v,elInput){
  if(v===''||+v===0){ delete packPick.sel[orderId]; } else { packPick.sel[orderId]=+v; }
  if(elInput){ const row=elInput.closest('.pick-row'); const on=packPick.sel[orderId]!==undefined;
    const cb=row?row.querySelector('input[type=checkbox]'):null; if(cb) cb.checked=on; if(row) row.classList.toggle('sel',on); }
  updatePackPickCount();
}
function packSelectAllStock(){ const g=orderGroups().find(x=>x.key===packPick.group); if(!g) return;
  const q=(packPick.q||'').toLowerCase();
  g.orders.forEach(o=>{ if(q && !((o.code+' '+(o.profile||'')+' '+(o.description||'')).toLowerCase().includes(q))) return;
    const a=packAvail(o.id); if(a>0) packPick.sel[o.id]=a; });
  renderPackItems(); }
function packClearSel(){ packPick.sel={}; renderPackItems(); }
function updatePackPickCount(){ const n=Object.keys(packPick.sel).length; const t=Object.values(packPick.sel).reduce((a,x)=>a+(+x||0),0);
  const el=document.getElementById('packSelCount'); if(el) el.textContent=n?(n+' selected · '+nf(t)+' units'):'Nothing selected';
  const lbl=document.getElementById('packCommitLbl'); if(lbl) lbl.textContent=n?('Add '+n+' to container'):'Add selected'; }
function packCommit(){
  const g=orderGroups().find(x=>x.key===packPick.group); if(!g){ packBackToList(); return; }
  const ids=new Set(g.orders.map(o=>o.id));
  packLines=packLines.filter(p=>!ids.has(p.orderId));
  let n=0; Object.keys(packPick.sel).forEach(oid=>{ const q=+packPick.sel[oid]; if(q>0){ packLines.push({orderId:oid, qty:q}); n++; } });
  packBackToList();
  toast(n?(n+' item'+(n===1?'':'s')+' added'):'Selection cleared for this order');
}
function updatePackTotal(){
  const t=packLines.reduce((a,p)=>a+(+p.qty||0),0);
  const el=document.getElementById('packTotal'); if(el) el.textContent=nf(t);
}
function savePack(id){
  try{ savePackInner(id); }
  catch(err){
    console.error('savePack failed:',err);
    alert('This container could not be saved.\n\n'+((err&&err.message)||err)+'\n\nNothing was changed. Please send this message on so it can be fixed.');
  }
}
function savePackInner(id){
  const no=val('c_no').trim();
  if(!no){ document.getElementById('c_no').classList.add('err'); toast('Enter a container number'); return; }
  const lines=packLines.filter(p=>p.orderId && (+p.qty)>0).map(p=>({orderId:p.orderId, qty:+p.qty}));
  if(!lines.length){ toast('Add at least one stock line with a quantity'); return; }
  // check availability; allow shipping extra beyond what's in production, with a heads-up
  const existing = id? (container(id).lines||[]) : [];
  const over=[];
  for(const l of lines){
    const o=order(l.orderId); if(!o) continue;   // orphaned line (its order was deleted) — keep it, just skip the check
    const s=orderStats(o);
    const already = existing.filter(e=>e.orderId===l.orderId).reduce((a,e)=>a+e.qty,0);
    const avail = s.inProduction + already; // editing frees up its own qty
    if(l.qty>avail) over.push(`${o.code} ${o.profile||''}`.trim()+` (+${l.qty-avail} over)`);
  }
  if(over.length && !confirm('Shipping more than the outstanding balance for:\n  '+over.join('\n  ')+'\n\nThat\'s fine — the extra just ships on top of what was ordered. Continue?')) return;
  const shipType = val('c_shipType')||'direct';
  const transhipment = shipType==='transhipment';
  const data={ containerNo:no, vessel:val('c_vessel').trim(), line:val('c_line').trim(),
    loadDate:val('c_load')||null, etd:val('c_etd')||null, eta:val('c_eta')||null, comment:val('c_comment').trim(), link:val('c_link').trim(),
    terminal:val('c_terminal')||'', finalVessel:!!(document.getElementById('c_finalVessel')||{}).checked,
    pol:val('c_pol')||'', containerType:val('c_ctype')||'',
    transhipment,
    tsEtd: transhipment ? (val('c_ts_etd')||null) : null,
    tsEta: transhipment ? (val('c_ts_eta')||null) : null,
    tsVessel: transhipment ? val('c_ts_vessel').trim() : '',
    lines };
  if(id){ const c=container(id); if(!c) throw new Error('That container no longer exists — it may have been deleted in another tab.'); Object.assign(c, data); }
  else { state.containers.push({ id:uid('c'), createdAt:Date.now(), status:'On Water', ...data }); }
  const ok=save();
  closeModal(); render();
  if(ok){ toast(id?'Container updated':'Container packed — stock moved to On Water'); if(id) flashContainer(id); }
}
/* The container list is sorted by ETA, so editing an ETA moves the card. Point at where it went. */
function flashContainer(id){
  setTimeout(()=>{ const card=document.querySelector('[data-cc="'+id+'"]'); if(!card) return;
    try{ card.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
    card.classList.add('flash'); setTimeout(()=>card.classList.remove('flash'),1700);
  },60);
}
function receiveContainer(id){ const c=container(id); c.status='Delivered'; c.deliveredAt=todayISO(); save(); render(); toast('Container received — stock delivered'); }
function unreceiveContainer(id){ const c=container(id); c.status='On Water'; delete c.deliveredAt; save(); render(); toast('Container reopened'); }
function deleteContainer(id){ if(!confirm('Delete this container? Its stock returns to production.')) return;
  state.containers=state.containers.filter(c=>c.id!==id); selectedContainers.delete(id);
  state.pnl=(state.pnl||[]).filter(r=>r.containerId!==id);
  save(); render(); toast('Container deleted'); }

/* ============ BULK EDIT SHIPMENT DETAILS ============ */
/* ---------- BULK SHIPMENT EDIT ----------
   Fields are pre-filled from the containers you selected, so updating one thing (usually
   the ETA) means editing that one box rather than retyping every value. Where the selected
   containers disagree on a field, the box is left empty and marked "varies" — filling it in
   would overwrite them all, so that has to be a deliberate act. */
function bulkCurrent(key){
  const vals=[...selectedContainers].map(id=>{
    const c=container(id); if(!c) return '';
    if(key==='shipType') return c.transhipment? 'transhipment':'direct';
    const v=c[key];
    return (v==null||v===false)? '' : String(v);
  });
  const distinct=[...new Set(vals)];
  return { value: distinct.length===1? distinct[0] : '', varies: distinct.length>1, count: distinct.length };
}
function bulkVariesTag(cur){
  return cur.varies
    ? ` <span class="chip" style="color:var(--amber);border-color:var(--amber);font-size:10px" title="The selected containers hold ${cur.count} different values here. Typing a value will set them all the same.">varies</span>`
    : '';
}
/* Editing a value ticks its box automatically — otherwise it is easy to type a new ETA,
   forget the tick, and have the change silently discarded. */
function bulkTouch(key){
  const chk=document.getElementById('bulk_chk_'+key);
  if(chk && !chk.checked){ chk.checked=true; }
  bulkSyncRow(key);
}
function bulkSyncRow(key){
  const chk=document.getElementById('bulk_chk_'+key);
  const row=document.getElementById('bulk_row_'+key);
  if(row) row.classList.toggle('bulk-on', !!(chk && chk.checked));
}
function bulkToggle(key){
  const chk=document.getElementById('bulk_chk_'+key);
  const el=document.getElementById('bulk_val_'+key);
  if(chk && el && !chk.checked){ el.value=el.dataset.orig||''; }   // unticking restores what was there
  bulkSyncRow(key);
}
function bulkRowShell(key,label,inner,cur){
  return `<div class="field row bulk-row" id="bulk_row_${key}" style="align-items:flex-end;gap:10px">
    <div style="flex:0 0 20px;padding-bottom:11px"><input type="checkbox" id="bulk_chk_${key}" style="width:16px;height:16px" onchange="bulkToggle('${key}')"></div>
    <div style="flex:1"><label>${esc(label)}${bulkVariesTag(cur)}</label>${inner}</div>
  </div>`;
}
function bulkField(key,label,type,placeholder,listId){
  const cur=bulkCurrent(key);
  const listAttr = listId ? `list="${listId}"` : '';
  const ph = cur.varies? 'Multiple values — type to set all' : (placeholder||'');
  const inner=`<input type="${type}" id="bulk_val_${key}" ${listAttr} value="${esc(cur.value)}" data-orig="${esc(cur.value)}" placeholder="${esc(ph)}" oninput="bulkTouch('${key}')" onchange="bulkTouch('${key}')">`;
  return bulkRowShell(key,label,inner,cur);
}
function bulkFieldSelect(key,label,options){
  const cur=bulkCurrent(key);
  const opts=options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===cur.value&&!cur.varies?'selected':''}>${esc(l)}</option>`).join('');
  const inner=`<select id="bulk_val_${key}" data-orig="${esc(cur.value)}" onchange="bulkTouch('${key}')">${opts}</select>`;
  return bulkRowShell(key,label,inner,cur);
}
function bulkSelectionSummary(){
  const names=[...selectedContainers].map(id=>{ const c=container(id); return c? String(c.containerNo||c.vessel||'(no number)').replace(/\s+/g,'') : null; }).filter(Boolean);
  return names.length<=3? names.join(', ') : names.slice(0,3).join(', ')+' +'+(names.length-3)+' more';
}
function bulkClearTicks(){
  BULK_KEYS.forEach(k=>{ const chk=document.getElementById('bulk_chk_'+k); if(chk){ chk.checked=false; bulkToggle(k); } });
}
const BULK_KEYS=['vessel','line','loadDate','pol','containerType','etd','eta','shipType','tsEta','tsEtd','tsVessel'];
function openBulkShipModal(){
  if(selectedContainers.size===0){ toast('Select at least one container'); return; }
  const n=selectedContainers.size;
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<div class="modal"><div class="modal-head">
    <div><h3>Edit shipment details</h3><p>${n} selected · ${esc(bulkSelectionSummary())}<br>Fields show the current values — change only what you need. Ticked fields are written to all ${n}.</p></div>
    <div class="spacer"></div><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      ${bulkField('vessel','Vessel','text','e.g. NYK FURANO 1028W')}
      ${bulkField('line','Shipping line','text','e.g. ONE','lineList')}<datalist id="lineList">${LINES.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
      ${bulkField('loadDate','Load date','date')}
      ${bulkFieldSelect('pol','Port of load (POL)',[['','— Select —'],['Hebei','Hebei'],['Shenzhen','Shenzhen']])}
      ${bulkFieldSelect('containerType','Container type',[['','— Select —'],['40HQ','40HQ'],['40NOR','40NOR']])}
      ${bulkField('etd','ETD','date')}
      ${bulkField('eta','ETA','date')}
      ${bulkFieldSelect('shipType','Sailing type',[['direct','Direct sailing'],['transhipment','Transhipment']])}
      ${bulkField('tsEta','ETA TS port','date')}
      ${bulkField('tsEtd','ETD TS port','date')}
      ${bulkField('tsVessel','TS Vessel','text','e.g. MSC ANNA')}
    </div>
    <div class="modal-foot">
      <button class="btn left" onclick="bulkClearTicks()">Untick all</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="applyBulkShip()">Apply to ${n}</button>
    </div></div>`;
  ov.classList.add('open');
}
function applyBulkShip(){
  const keys=BULK_KEYS;
  const dateKeys=['loadDate','etd','eta','tsEta','tsEtd'];
  const trimKeys=['vessel','line','tsVessel'];
  const patch={};
  keys.forEach(k=>{
    const chk=document.getElementById('bulk_chk_'+k);
    if(chk && chk.checked){
      const el=document.getElementById('bulk_val_'+k);
      let v=el?el.value:'';
      if(trimKeys.includes(k)) v=v.trim();
      if(dateKeys.includes(k)) v=v||null;
      patch[k]=v;
    }
  });
  if(!Object.keys(patch).length){ toast('Tick at least one field to apply'); return; }
  selectedContainers.forEach(id=>{
    const c=container(id); if(!c) return;
    if('vessel' in patch) c.vessel=patch.vessel;
    if('line' in patch) c.line=patch.line;
    if('loadDate' in patch) c.loadDate=patch.loadDate;
    if('pol' in patch) c.pol=patch.pol;
    if('containerType' in patch) c.containerType=patch.containerType;
    if('etd' in patch) c.etd=patch.etd;
    if('eta' in patch) c.eta=patch.eta;
    if('shipType' in patch){
      c.transhipment = patch.shipType==='transhipment';
      if(!c.transhipment && !('tsEta' in patch) && !('tsEtd' in patch) && !('tsVessel' in patch)){
        c.tsEta=null; c.tsEtd=null; c.tsVessel='';
      }
    }
    if('tsEta' in patch) c.tsEta=patch.tsEta;
    if('tsEtd' in patch) c.tsEtd=patch.tsEtd;
    if('tsVessel' in patch) c.tsVessel=patch.tsVessel;
  });
  const ok=save(); closeModal(); render();
  if(ok) toast('Updated '+selectedContainers.size+' container'+(selectedContainers.size===1?'':'s'));
}

/* ============ XLSX WRITER (self-contained, no libraries) ============ */
/* styles: 0 default · 1 bold · 2 number(#,##0) · 3 bold number · 5 header(bold) */
function xcell(v, s){ const isNum = typeof v==='number' && isFinite(v);
  return { v: isNum? v : (v==null?'':String(v)), t: isNum?'n':'s', s: s||0 }; }
function xdate(d){ if(!d) return xcell(''); const x=(typeof d==='string')?new Date(d+'T00:00:00'):d;
  if(isNaN(x)) return xcell('');
  const serial=Math.floor((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())-Date.UTC(1899,11,30))/86400000);
  return { v:serial, t:'n', s:6 }; }
function xmlEsc(s){ return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function colLetter(n){ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function makeXlsx(sheetName, aoa, colW){
  const enc=new TextEncoder();
  // worksheet
  let dim='A1:'+colLetter(Math.max(0,(aoa[0]?aoa[0].length:1)-1))+aoa.length;
  let cols='';
  if(colW&&colW.length){ cols='<cols>'+colW.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>'; }
  let rowsXml='';
  aoa.forEach((row,r)=>{ let cells='';
    row.forEach((c,ci)=>{ const ref=colLetter(ci)+(r+1); const s=c.s?` s="${c.s}"`:'';
      if(c.t==='n') cells+=`<c r="${ref}"${s}><v>${c.v}</v></c>`;
      else cells+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c.v)}</t></is></c>`;
    });
    rowsXml+=`<row r="${r+1}">${cells}</row>`;
  });
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="${dim}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rowsXml}</sheetData></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0"/><numFmt numFmtId="165" formatCode="yyyy-mm-dd"/><numFmt numFmtId="166" formatCode="#,##0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="8"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="166" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>`;
  const wb=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const files=[
    {name:'[Content_Types].xml', data:enc.encode(ct)},
    {name:'_rels/.rels', data:enc.encode(rels)},
    {name:'xl/workbook.xml', data:enc.encode(wb)},
    {name:'xl/_rels/workbook.xml.rels', data:enc.encode(wbRels)},
    {name:'xl/styles.xml', data:enc.encode(styles)},
    {name:'xl/worksheets/sheet1.xml', data:enc.encode(sheet)},

  return zipStore(files);
}
let _crcTab=null;
function crc32(buf){ if(!_crcTab){ _crcTab=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); _crcTab[n]=c>>>0; } }
  let crc=0xFFFFFFFF; for(let i=0;i<buf.length;i++) crc=(crc>>>8)^_crcTab[(crc^buf[i])&0xFF]; return (crc^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const locals=[], centrals=[]; let offset=0; const enc=new TextEncoder();
  files.forEach(f=>{ const nameB=enc.encode(f.name), data=f.data, crc=crc32(data), len=data.length;
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(len),u32(len),u16(nameB.length),u16(0),[...nameB],[...data]);
    locals.push(local);
    centrals.push([].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(len),u32(len),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),[...nameB]));
    offset+=local.length;
  });
  const centralBytes=[].concat(...centrals), centralOffset=offset;
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralBytes.length),u32(centralOffset),u16(0));
  return new Uint8Array([].concat(...locals, centralBytes, end));
}
function downloadBytes(bytes, filename, mime){
  const blob=new Blob([bytes],{type:mime||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function importJSON(ev){
  const file=ev.target.files[0]; if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
    if(!d.orders||!d.containers) throw 0;
    if(!confirm('Restore this backup? It replaces all current data.')) return;
    state=d; if(!state.settings) state.settings={theme:'dark',weekStart:null};
    if(!state.products) state.products = buildProducts(state.settings.priceBook || DEFAULT_PRICEBOOK);
    delete state.settings.priceBook;
    if(!state.settings.billTo) state.settings.billTo={name:'FAIR DISCOUNTERS (PTY) LTD',vat:'VAT: 4150188904',addr:'8 Rente St, Ormonde, JHB, 2091'};
    if(!state.shippingCharges) state.shippingCharges={ roe:null, rmbToUsd:null, fwdShenzhenNor:null, fwdShenzhenHQ:null, fwdHebei:null, clearing:null, transport:null };
    if(state.shippingCharges.rmbToUsd===undefined) state.shippingCharges.rmbToUsd=null;
    if(!Array.isArray(state.pnl)) state.pnl=[];
    invoiceCtx=null;
    state.settings.lastBackupAt=Date.now();
    save(); applyTheme(); render(); renderBackupBanner(); toast('Data restored');
  }catch(e){ toast('That file could not be read'); } ev.target.value=''; };
  rd.readAsText(file);
}

const BACKUP_REMINDER_DAYS = 7;
let backupBannerDismissed = false;
function renderBackupBanner(){
  const el=document.getElementById('backupBanner'); if(!el) return;
  /* A failed save is never dismissable — it means edits are being lost. */
  if(saveFailed){
    el.innerHTML = `<div class="backup-banner danger">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div class="msg"><b>Changes are NOT being saved.</b> This browser refused to store the data — usually because the browser's storage limit is full (about ${storageMB().toFixed(1)} MB in use, the cap is normally 5 MB). Anything you edit now is lost when you close the tab. Download a backup immediately, then delete some old delivered containers or restore into a fresh browser profile.</div>
      <button class="btn sm primary" onclick="exportJSON()">Backup now</button>
    </div>`;
    return;
  }
  if(backupBannerDismissed){ el.innerHTML=''; return; }
  const mb=storageMB();
  if(mb>3.5){
    el.innerHTML = `<div class="backup-banner">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div class="msg">Storage is at <b>${mb.toFixed(1)} MB</b> of roughly 5 MB. Once it's full, saves start failing. Back up now and consider clearing out old delivered containers.</div>
      <button class="btn sm primary" onclick="exportJSON()">Backup now</button>
      <button class="x" title="Dismiss for this session" onclick="dismissBackupBanner()">✕</button>
    </div>`;
    return;
  }
  const last=state.settings.lastBackupAt;
  const days = last!=null ? Math.floor((Date.now()-last)/86400000) : null;
  if(days!=null && days<BACKUP_REMINDER_DAYS){ el.innerHTML=''; return; }
  const msg = days==null
    ? `You haven't downloaded a backup yet. <b>All data lives only in this browser</b> — clearing site data or switching devices loses it.`
    : `It's been <b>${days} day${days===1?'':'s'}</b> since your last backup — worth downloading a fresh one.`;
  el.innerHTML = `<div class="backup-banner">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div class="msg">${msg}</div>
    <button class="btn sm primary" onclick="exportJSON()">Backup now</button>
    <button class="x" title="Dismiss for this session" onclick="dismissBackupBanner()">✕</button>
  </div>`;
}
function dismissBackupBanner(){ backupBannerDismissed=true; renderBackupBanner(); }
