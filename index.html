<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order &amp; Container Tracker — Much Better Furniture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --bg-2:#0f1622; --panel:#141b27; --panel-2:#1a2230; --line:#243044;
  --line-soft:#1b2433; --txt:#e6edf6; --txt-2:#aab6c8; --txt-3:#6b7889;
  --accent:#4c8dff; --accent-2:#2f6fe0; --accent-soft:rgba(76,141,255,.14);
  --grey:#8a96a8; --grey-bg:rgba(138,150,168,.13);
  --amber:#e0a23b; --amber-bg:rgba(224,162,59,.14);
  --blue:#4c8dff; --blue-bg:rgba(76,141,255,.14);
  --green:#3fb27f; --green-bg:rgba(63,178,127,.14);
  --red:#e5614e; --red-bg:rgba(229,97,78,.14);
  --shadow:0 8px 28px rgba(0,0,0,.45); --radius:13px; --radius-s:9px;
}
[data-theme="light"]{
  --bg:#eef1f5; --bg-2:#e6ebf2; --panel:#ffffff; --panel-2:#f4f7fb; --line:#d4dae3;
  --line-soft:#e3e7ee; --txt:#1b2230; --txt-2:#3a4250; --txt-3:#697585;
  --accent:#2f5fd0; --accent-2:#2550b8; --accent-soft:rgba(47,95,208,.10);
  --grey:#7a8696; --grey-bg:rgba(122,134,150,.12);
  --amber:#c1820b; --amber-bg:rgba(193,130,11,.13);
  --blue:#2f5fd0; --blue-bg:rgba(47,95,208,.11);
  --green:#1f9e6a; --green-bg:rgba(31,158,106,.13);
  --red:#cc2233; --red-bg:rgba(204,34,51,.10);
  --shadow:0 10px 30px rgba(40,55,80,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--txt-3)}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:226px;flex:0 0 226px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff7a18,#e5371d);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px;flex:0 0 auto}
.brand h1{font-size:14.5px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand .sub{font-size:11px;color:var(--txt-3);margin-top:2px;letter-spacing:.3px;text-transform:uppercase}
.nav{padding:12px 12px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt-3);
  padding:12px 12px 6px;font-weight:600}
.nav a{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-s);
  color:var(--txt-2);font-weight:500;font-size:13.5px;margin-bottom:2px;transition:.13s;position:relative;
}
.nav a:hover{background:var(--panel);color:var(--txt)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a .ic{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav a .badge{margin-left:auto;font-size:11px;background:var(--panel-2);color:var(--txt-2);
  padding:1px 7px;border-radius:20px;font-weight:600;min-width:20px;text-align:center}
.nav a.active .badge{background:var(--accent);color:#fff}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:14px;padding:15px 26px;border-bottom:1px solid var(--line);
  background:var(--bg);position:sticky;top:0;z-index:30;
}
.topbar .title h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.topbar .title p{margin:1px 0 0;font-size:12.5px;color:var(--txt-3)}
.topbar .spacer{flex:1}
.content{padding:24px 26px 60px;max-width:1500px;width:100%}
.backup-banner{display:flex;align-items:center;gap:12px;padding:10px 26px;background:var(--amber-bg);border-bottom:1px solid var(--line)}
.backup-banner .ic{width:17px;flex:0 0 auto;color:var(--amber)}
.backup-banner .msg{font-size:12.8px;color:var(--txt-2);flex:1;min-width:0}
.backup-banner .msg b{color:var(--txt-1)}
.backup-banner .x{background:none;border:none;color:var(--txt-3);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1;flex:0 0 auto}
.backup-banner .x:hover{color:var(--txt-1)}
.backup-banner.danger{background:var(--red-bg);border-bottom:2px solid var(--red)}
.backup-banner.danger .ic{color:var(--red)}
.backup-banner.danger .msg b{color:var(--red)}
@media print{ .backup-banner{display:none!important} }
/* ---------- Price list sheet ----------
   Rendered as paper in both themes, since it previews a document that goes out to customers. */
.panel.pl-sheet{background:#fff;color:#111;border-color:#d9d9d9}
.panel.pl-sheet .panel-body{padding:30px 34px;background:#fff;color:#111}
.pl-head{display:flex;align-items:center;gap:22px;margin-bottom:22px}
.pl-logo{width:84px;height:auto;flex:0 0 auto}
.pl-marks{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
.pl-wordmark{max-width:min(430px,100%);width:100%;height:auto}
.pl-title{max-width:150px;width:38%;height:auto}
.pl-table{width:100%;border-collapse:collapse;font-size:12.5px;color:#111}
.pl-table th{background:#fff;color:#111;text-align:center;font-weight:600;font-size:12px;
  text-transform:none;letter-spacing:0;padding:5px 8px;border:2px solid #000}
.pl-table td{padding:3px 8px;border-left:2px solid #000;border-right:2px solid #000;
  border-bottom:none;color:#111;background:#fff}
.pl-table tbody tr:last-child td{border-bottom:2px solid #000}
.pl-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.pl-table td.pl-code{text-align:left;white-space:nowrap}
.pl-table tbody tr:hover td{background:#f6f6f6}
.panel.pl-sheet .pl-foot{margin-top:28px;font-size:12.5px;color:#111}
.panel.pl-sheet .pl-dates{line-height:1.8;margin-bottom:28px;color:#111}
.pl-sigs{display:flex;gap:60px;flex-wrap:wrap}
.pl-sig{min-width:215px}
.panel.pl-sheet .pl-party{font-weight:600;margin-bottom:34px;color:#111}
.panel.pl-sheet .pl-line{border-top:1px solid #000;width:100%}
@keyframes ccFlash{ 0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)} 15%,60%{box-shadow:0 0 0 3px var(--blue)} }
.ccard.flash{ animation:ccFlash 1.6s ease-in-out 1 }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--radius-s);
  background:var(--panel);border:1px solid var(--line);color:var(--txt);font-weight:600;font-size:13px;
  transition:.13s;white-space:nowrap;
}
.btn:hover{background:var(--panel-2);border-color:var(--txt-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt-2)}
.btn.ghost:hover{background:var(--panel);color:var(--txt)}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn .ic{width:15px;height:15px}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--panel);display:grid;place-items:center;transition:.13s}
.icon-btn:hover{background:var(--panel-2);border-color:var(--txt-3)}
.icon-btn .ic{width:17px;height:17px}

/* ---------- KPI strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:13px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.k-grey::before{background:var(--grey)} .kpi.k-amber::before{background:var(--amber)}
.kpi.k-blue::before{background:var(--blue)} .kpi.k-green::before{background:var(--green)}
.kpi.k-red::before{background:var(--red)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-3);font-weight:600}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-1px;margin-top:7px;line-height:1}
.kpi .note{font-size:12px;color:var(--txt-3);margin-top:6px}

/* ---------- Cards / panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-head h3{margin:0;font-size:14.5px;font-weight:700}
.panel-head .sub{font-size:12px;color:var(--txt-3)}
.panel-head .spacer{flex:1}
.panel-body{padding:6px 0}
.empty{padding:46px 24px;text-align:center;color:var(--txt-3)}
.empty .big{font-size:15px;color:var(--txt-2);font-weight:600;margin-bottom:5px}
.empty .ic{width:34px;height:34px;opacity:.4;margin-bottom:12px}

/* ---------- Toolbar (filters) ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:var(--radius-s);
  border:1px solid var(--line);background:var(--panel);color:var(--txt)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt-3)}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:3px}
.seg button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--txt-2)}
.seg button.active{background:var(--accent-soft);color:var(--accent)}
select.filter{padding:8px 12px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--panel);color:var(--txt);font-weight:500}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  background:var(--panel);position:sticky;top:0;
}
thead th.num,td.num{text-align:right}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer;transition:.1s}
tbody tr.clickable:hover{background:var(--panel-2)}
tbody tr.group-row td{background:var(--bg-2);font-weight:700;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--txt-2);padding:8px 14px}
.code-cell{font-weight:600}
.desc-cell{color:var(--txt-2);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .mono{font-size:12.5px}
.minor{color:var(--txt-3)}

/* ---------- Sortable / filterable column headers ---------- */
.th-inner{display:flex;align-items:center;justify-content:space-between;gap:6px}
.th-label{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:3px}
.th-label:hover{color:var(--txt)}
.sort-ind{font-size:9px;color:var(--accent)}
.th-filter-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:5px;color:var(--txt-3);flex:none}
.th-filter-btn:hover{background:var(--panel-2);color:var(--txt)}
.th-filter-btn.active{color:var(--accent);background:var(--accent-soft)}
.col-filter-pop{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  box-shadow:var(--shadow);z-index:300;width:220px;padding:9px;display:flex;flex-direction:column;gap:7px;
  font-size:12.5px;text-transform:none;letter-spacing:normal;font-weight:400;color:var(--txt)}
.col-filter-pop input[type="text"]{width:100%;padding:6px 9px;border-radius:7px;border:1px solid var(--line);
  background:var(--bg-2);color:var(--txt);font-size:12.5px}
.col-filter-actions{display:flex;justify-content:space-between;gap:6px}
.col-filter-actions button{color:var(--accent);font-size:11.5px;font-weight:600;padding:2px 3px}
.col-filter-actions button:hover{text-decoration:underline}
.col-filter-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;
  border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:5px 0}
.col-filter-item{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:6px;cursor:pointer}
.col-filter-item:hover{background:var(--panel-2)}
.col-filter-item input{margin:0;flex:none}
.col-filter-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Badges ---------- */
.badge-st{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-st::before{content:"";width:6px;height:6px;border-radius:50%}
.st-grey{background:var(--grey-bg);color:var(--grey)} .st-grey::before{background:var(--grey)}
.st-amber{background:var(--amber-bg);color:var(--amber)} .st-amber::before{background:var(--amber)}
.st-blue{background:var(--blue-bg);color:var(--blue)} .st-blue::before{background:var(--blue)}
.st-green{background:var(--green-bg);color:var(--green)} .st-green::before{background:var(--green)}
.st-red{background:var(--red-bg);color:var(--red)} .st-red::before{background:var(--red)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--panel-2);
  border:1px solid var(--line);font-size:11.5px;font-weight:600;margin:2px 3px 2px 0}
.chip.mono{font-size:11px}

/* qty mini-bar */
.qbar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--line-soft);width:120px}
.qbar i{display:block;height:100%}
.qbar .q-prod{background:var(--grey)} .qbar .q-water{background:var(--blue)} .qbar .q-del{background:var(--green)} .qbar .q-canc{background:var(--red)}
.qlegend{display:flex;gap:12px;font-size:11px;color:var(--txt-3);margin-top:3px}
.qlegend span{display:inline-flex;align-items:center;gap:4px}
.qlegend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,9,16,.62);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;width:100%;
  max-width:560px;box-shadow:var(--shadow);animation:pop .16s ease}
.modal.wide{max-width:820px}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:16.5px;font-weight:700}
.modal-head p{margin:2px 0 0;font-size:12.5px;color:var(--txt-3)}
.modal-head .spacer{flex:1}
.modal-body{padding:20px 22px;max-height:calc(100vh - 230px);overflow-y:auto}
.modal-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);justify-content:flex-end}
.modal-foot .left{margin-right:auto}
.close-x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--txt-3)}
.close-x:hover{background:var(--panel-2);color:var(--txt)}

/* forms */
.field{margin-bottom:15px}
.field.row{display:flex;gap:13px}
.field.row>div{flex:1}
.field label{display:block;font-size:12px;font-weight:600;color:var(--txt-2);margin-bottom:6px}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border-radius:var(--radius-s);border:1px solid var(--line);
  background:var(--bg-2);color:var(--txt);transition:.13s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);
  background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:62px}
.field .hint{font-size:11.5px;color:var(--txt-3);margin-top:5px}
.field input.err,.field select.err{border-color:var(--red)}

/* combobox */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius-s);box-shadow:var(--shadow);
  max-height:240px;overflow-y:auto;z-index:5;display:none}
.combo-list.open{display:block}
.combo-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line-soft);font-size:13px}
.combo-item:last-child{border-bottom:none}
.combo-item:hover,.combo-item.active{background:var(--accent-soft)}
.combo-item .c-code{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px}
.combo-item .c-desc{color:var(--txt-3);font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* pack builder */
.pack-line{display:grid;grid-template-columns:1fr 110px 36px;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-soft)}
.pack-line .ord{font-size:13px}
.pack-line .ord .meta{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.pack-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0 2px;font-weight:700}
.avail{font-size:11px;color:var(--txt-3)}
/* pack: order item picker */
.pack-list{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.pack-grp{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-2);font-weight:700;padding:8px 10px;background:var(--bg-2);border-bottom:1px solid var(--line-soft)}
.pack-line-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.pack-line-row:last-child{border-bottom:none}
.pack-line-row .x{width:24px;height:24px;border-radius:6px;color:var(--red);font-size:16px;line-height:1;background:none;border:none;flex:0 0 auto}
.pack-line-row .x:hover{background:var(--red-bg)}
.pick-bar{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.pick-items{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:9px}
.pick-head{display:grid;grid-template-columns:30px 1fr 88px 64px 92px;gap:8px;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt-3);font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.pick-row{display:grid;grid-template-columns:30px 1fr 88px 64px 92px;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line-soft)}
.pick-row:last-child{border-bottom:none}
.pick-row.sel{background:var(--accent-soft)}
.pick-row .pcode{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:12px}
.pick-row .pdesc{font-size:11px;color:var(--txt-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-row .prem{font-size:11.5px;color:var(--txt-2);text-align:right;font-family:'JetBrains Mono',monospace}
.pick-row input[type=number]{padding:6px 8px;border-radius:7px;border:1px solid var(--line);background:var(--bg-2);color:var(--txt);text-align:right;width:100%}
.pick-row input[type=number]:focus{outline:none;border-color:var(--accent)}
.pick-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}
/* collapsible container cards — vessel leads, dates sit in fixed columns so they scan vertically */
.ccard{margin-bottom:9px}
.ccard-head{cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 15px}
.ccard-head:hover{background:var(--panel-2)}
.caret{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--txt-3);background:none;border:none;flex:0 0 auto}
.caret svg{width:15px;height:15px;transition:transform .15s}
.ccard.open .caret svg{transform:rotate(90deg)}
.caret:hover{background:var(--line);color:var(--txt)}
.ccard-actions{display:flex;gap:6px;flex:0 0 auto}
.cc-id{width:216px;flex:0 0 auto;min-width:0}
.cc-vessel{font-size:13px;font-weight:600;letter-spacing:0;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-no{font-size:12px;color:var(--txt-2);margin-top:1px;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Transship carries two dates, so it needs more room than the single-date columns. */
.cc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.6fr);flex:1 1 auto;min-width:0}
.cc-cell{display:flex;flex-direction:column;align-items:flex-end;padding:0 12px;
  border-left:1px solid var(--line-soft);min-width:72px;overflow:hidden}
.cc-cell .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc-cell .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt-3);font-weight:600}
.cc-cell .v{font-size:12.5px;margin-top:2px;white-space:nowrap}
.cc-cell .v.strong{color:var(--txt);font-weight:600}
.cc-tail{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto;
  padding-left:12px;width:266px}
.cc-badge-slot{width:78px;flex:0 0 auto;display:flex;justify-content:flex-end}
.cc-menu-wrap{position:relative}
.cc-menu-btn{padding:5px 9px;line-height:1}
.cc-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:40;min-width:186px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);
  box-shadow:var(--shadow);padding:5px;display:none}
.cc-menu.open{display:block}
/* The card clips its own overflow, so let it through while a menu is showing. */
.ccard.menu-open{overflow:visible;position:relative;z-index:50}
/* Bulk edit: a ticked row is the one that will actually be written, so mark it clearly. */
.bulk-row{border-radius:9px;padding:4px 6px;margin:0 -6px;transition:background .12s}
.bulk-row.bulk-on{background:var(--accent-soft)}
.bulk-row.bulk-on label{color:var(--accent)}
/* Factory rename chooser */
.fr-opts{display:flex;flex-direction:column;gap:9px}
.fr-opt{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:12px 14px;color:var(--txt);font-family:inherit}
.fr-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.fr-opt b{font-size:13px}
.fr-opt span{font-size:12px;color:var(--txt-3);line-height:1.55}
.cc-menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;color:var(--txt);font-size:12.5px;padding:7px 10px;
  border-radius:7px;cursor:pointer;font-family:inherit}
.cc-menu button:hover{background:var(--panel-2)}
.cc-menu button.danger{color:var(--red)}
.cc-menu .divider{height:1px;background:var(--line-soft);margin:4px 2px}
.cc-menu .ic{width:14px;flex:0 0 auto}
@media (max-width:820px){ .cc-tail{width:auto} .cc-badge-slot{width:auto} }
.cc-meta{padding:2px 15px 2px 65px;border-top:1px solid var(--line);background:var(--panel-2);
  font-size:10.5px;color:var(--txt-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
/* Factory reads as a plain bold label — no pill, no colour, it just needs to be findable. */
.cc-fact{font-size:11px;font-weight:700;color:var(--txt);letter-spacing:.1px}
/* Discharge terminal sits hard right, balancing the factory name on the left. */
.cc-term{margin-left:auto}
/* Vessel not yet confirmed — head matches the meta strip beneath it. */
.ccard.cc-prov .ccard-head{background:var(--panel-2)}
.ccard.cc-prov .ccard-head:hover{background:var(--panel-2)}
@media (max-width:820px){ .cc-term{margin-left:0} }
/* Total sits in the Qty shipped column, plain weight — it is a sum, not a heading. */
.cc-total td{border-top:1px solid var(--line);background:none;font-weight:400;color:var(--txt-2)}
.cc-sep{color:var(--line)}
@media (max-width:1400px){ .cc-cell.opt2{display:none} }
@media (max-width:1400px){ .cc-grid{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr)} }
@media (max-width:1180px){
  .cc-grid{grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,1.6fr)}
  .cc-cell.opt{display:none}
}
@media (max-width:820px){
  .ccard-head{flex-wrap:wrap}
  .cc-id{width:auto;flex:1 1 100%}
  .cc-grid{grid-template-columns:repeat(3,1fr);flex:1 1 100%;margin-top:8px}
  .cc-cell{padding:0 9px}
  .cc-cell:first-child{border-left:none;align-items:flex-start}
  .cc-meta{padding-left:15px}
}
@media print{ .ccard-body{display:block!important} .caret,.ccard-actions{display:none!important} }

/* detail rows */
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:18px}
.detail-grid .d-cell .dl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);font-weight:600}
.detail-grid .d-cell .dv{font-size:15px;font-weight:600;margin-top:3px}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--txt);color:var(--bg);padding:11px 20px;border-radius:10px;font-weight:600;font-size:13px;
  box-shadow:var(--shadow);opacity:0;transition:.22s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.matrix td.num, .matrix th.num{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.matrix td.zero{color:var(--txt-3)}
.month-col{min-width:78px}

/* ---------- BUYER REPORT ---------- */
.buyer-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.buyer-head h3{margin:0;font-size:16px;font-weight:700}
.buyer-head .sub{font-size:12px;color:var(--txt-3);margin-top:3px}
.buyer-summary{display:flex;gap:6px;flex-wrap:wrap}
.buyer-tbl tbody td{border-bottom:1px solid var(--line-soft)}
.buyer-tbl tr.brow td:first-child{border-left:3px solid transparent}
.buyer-tbl tr.b-grey td{background:var(--grey-bg)} .buyer-tbl tr.b-grey td:first-child{border-left-color:var(--grey)}
.buyer-tbl tr.b-amber td{background:var(--amber-bg)} .buyer-tbl tr.b-amber td:first-child{border-left-color:var(--amber)}
.buyer-tbl tr.b-blue td{background:var(--blue-bg)} .buyer-tbl tr.b-blue td:first-child{border-left-color:var(--blue)}
.buyer-tbl tr.b-green td{background:var(--green-bg)} .buyer-tbl tr.b-green td:first-child{border-left-color:var(--green)}
.buyer-tbl tr.b-red td{background:var(--red-bg)} .buyer-tbl tr.b-red td:first-child{border-left-color:var(--red)}
.buyer-tbl td.late{color:var(--red);font-weight:700}
.buyer-tbl tr.brow:hover td{filter:brightness(1.04)}

/* ---------- DASHBOARD (arrivals) ---------- */
.dash-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.dash-kpi{background:var(--panel);padding:16px 18px}
.dash-kpi .l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3)}
.dash-kpi .v{font-size:25px;font-weight:700;margin-top:5px;font-family:'JetBrains Mono',monospace;line-height:1}
.dash-kpi .v.accent{color:var(--accent)} .dash-kpi .v.green{color:var(--green)} .dash-kpi .v.warn{color:var(--amber)} .dash-kpi .v.red{color:var(--red)}
.dash-kpi .s{font-size:12px;color:var(--txt-3);margin-top:4px}
.dash-main{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.dash-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.dash-card .ch{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.dash-card .ch .t{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-2)}
.dash-card .ch .n{font-size:11px;color:var(--txt-3)}
.dash-filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}
.dash-filters select,.dash-filters input{background:var(--bg-2);border:1px solid var(--line);color:var(--txt);padding:6px 9px;border-radius:7px;font-size:12px;outline:none}
.dash-filters select:focus,.dash-filters input:focus{border-color:var(--accent)}
.dash-filters .fg{display:flex;align-items:center;gap:5px} .dash-filters .fg label{font-size:11px;color:var(--txt-3)}
.dash-filters .sw{flex:1;min-width:120px} .dash-filters .sw input{width:100%}
.man-tbl{width:100%;border-collapse:collapse}
.man-tbl th{padding:8px 12px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-3);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.man-tbl th:hover{color:var(--txt)} .man-tbl th.r{text-align:right}
.man-tbl td{padding:8px 12px;font-size:12px;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
.man-tbl td.num{font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right}
.man-tbl td.mono{font-family:'JetBrains Mono',monospace;font-size:11px}
.man-tbl tr:hover td{background:var(--panel-2)}
.abadge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.abadge.now{background:var(--green-bg);color:var(--green)} .abadge.next{background:var(--accent-soft);color:var(--accent)}
.abadge.soon{background:var(--amber-bg);color:var(--amber)} .abadge.later{background:var(--grey-bg);color:var(--grey)} .abadge.over{background:var(--red-bg);color:var(--red)}
.wk-row{padding:11px 16px;border-bottom:1px solid var(--line)}
.wk-top{display:flex;justify-content:space-between;align-items:center}
.wk-name{font-weight:600;font-size:13px} .wk-meta{font-size:11px;color:var(--txt-3);font-family:'JetBrains Mono',monospace}
.wk-track{margin-top:7px;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.wk-fill{height:100%;border-radius:3px;background:var(--accent)}
.ln-row{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ln-name{font-size:12px;font-weight:500} .ln-meta{font-size:11px;color:var(--txt-3);font-family:'JetBrains Mono',monospace}
@media(max-width:980px){ .dash-main{grid-template-columns:1fr} .dash-kpis{grid-template-columns:repeat(3,1fr)} }

/* ---------- INVOICE (fixed white-paper palette, theme-independent) ---------- */
.inv-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.inv-toolbar select{padding:8px 12px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:500}
.invoice{max-width:840px;margin:0 auto;background:#fff;color:#1b2230;padding:30px 34px;border:1px solid #d4dae3;border-radius:8px;box-shadow:var(--shadow)}
.invoice *{box-sizing:border-box}
.invoice .brandbar{background:#dceaf7;margin:-30px -34px 18px -34px;padding:15px 34px 13px;text-align:center;border-bottom:2px solid #b9cce6;border-radius:8px 8px 0 0}
.invoice .brandbar img{height:52px;width:auto;max-width:100%;display:inline-block}
.invoice .inv-top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1b2230;padding-bottom:14px}
.invoice .seller .co{font-size:18px;font-weight:700}
.invoice .seller div{font-size:11.5px;color:#3a4250;line-height:1.55}
.invoice .inv-meta{text-align:right;min-width:230px}
.invoice .inv-meta .tax{font-size:17px;font-weight:700;letter-spacing:.5px;margin-bottom:8px}
.invoice .metarow{display:flex;justify-content:flex-end;gap:10px;font-size:12px;margin-top:3px}
.invoice .metarow .lbl{color:#697585;font-weight:600}
.invoice .metarow .val{min-width:96px;text-align:left;font-weight:600}
.invoice [contenteditable]{outline:none;border-bottom:1px dashed transparent}
.invoice [contenteditable]:hover{border-bottom-color:#c9d2de}
.invoice [contenteditable]:focus{border-bottom-color:#2f5fd0;background:#f7f9fc}
.invoice .billrow{display:flex;justify-content:space-between;gap:30px;margin-top:16px}
.invoice .billto .h{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#697585;font-weight:700;margin-bottom:3px}
.invoice .billto .name{font-size:14px;font-weight:700}
.invoice .billto div{font-size:11.5px;color:#3a4250;line-height:1.5}
.invoice table.items{width:100%;border-collapse:collapse;margin-top:18px}
.invoice table.items th{background:#e9edf3;color:#3a4759;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:7px 9px;text-align:left;border-bottom:2px solid #44546a}
.invoice table.items th.r{text-align:right}
.invoice table.items td{padding:6px 9px;font-size:12px;border-bottom:1px solid #eceff3;color:#1b2230}
.invoice table.items td.qty,.invoice table.items td.price,.invoice table.items td.amt{text-align:right;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:nowrap}
.invoice .inv-price{border-radius:4px;padding:1px 3px;cursor:text}
.invoice .inv-price:hover{box-shadow:inset 0 0 0 1px #c7d0db}
.invoice .inv-price:focus{box-shadow:inset 0 0 0 1px #44546a;background:#f5f8fc}
@media print{.invoice .inv-price:hover,.invoice .inv-price:focus{box-shadow:none;background:none}}
.invoice table.items td.code{font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;white-space:nowrap}
.invoice .miss{color:#c23;font-style:italic} .invoice .miss-amt{color:#c23}
.invoice .totes{display:flex;justify-content:space-between;margin-top:4px}
.invoice .totes .qtytot{font-size:12px;padding:10px 9px;font-weight:600}
.invoice .totals{width:260px;margin-left:auto}
.invoice .totals .tr{display:flex;justify-content:space-between;padding:6px 9px;font-size:12.5px}
.invoice .totals .tr .lbl{color:#3a4250} .invoice .totals .tr .v{font-family:'JetBrains Mono',monospace}
.invoice .totals .tr.sub{border-top:1px solid #e3e7ee}
.invoice .totals .tr.grand{border-top:2px solid #1b2230;font-weight:700;font-size:14px;margin-top:2px}
.invoice .pofoot{margin-top:18px;font-size:11px;color:#3a4250;letter-spacing:.02em}
.invoice .pofoot b{color:#1b2230}
.invoice .pofoot .poval{outline:none;display:inline-block;min-width:60px;border-bottom:1px dotted #c7cddb;padding:0 2px}
.invoice .bankfoot{margin-top:22px;border-top:1px solid #e3e7ee;padding-top:10px;font-size:11px;color:#3a4250;display:flex;gap:26px;flex-wrap:wrap}
.invoice .bankfoot b{color:#1b2230}
.price-panel{max-width:840px;margin:0 auto 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px}
.price-panel h3{font-size:13px;margin:0 0 6px}
.price-panel .pp-note{font-size:11.5px;color:var(--txt-3);margin-bottom:10px}
.pp-table{width:100%;border-collapse:collapse;font-size:12px}
.pp-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);padding:4px 6px;border-bottom:1px solid var(--line)}
.pp-table td{padding:2px 4px;border-bottom:1px solid var(--line-soft)}
.pp-table input{width:100%;border:1px solid transparent;background:transparent;font-family:inherit;font-size:12px;padding:5px 7px;border-radius:6px;color:var(--txt)}
.pp-table input:focus{border-color:var(--accent);background:var(--bg-2);outline:none}
.pp-table td.code input{font-family:'JetBrains Mono',monospace}
.pp-del{cursor:pointer;color:var(--red);border:none;background:none;font-size:15px}
.prod-in{width:100%;border:1px solid transparent;background:transparent;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:7px;color:var(--txt)}
.prod-in:hover{border-color:var(--line)}
.prod-in:focus{border-color:var(--accent);background:var(--bg-2);outline:none}
#prod-table td{padding:4px 8px;vertical-align:middle}
.tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:32px;padding:2px 4px;border:1px solid transparent;border-radius:7px}
.tags:focus-within{border-color:var(--accent);background:var(--bg-2)}
.tag{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 3px 2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.tag button{color:var(--accent);font-size:14px;line-height:1;padding:0 3px;border-radius:4px}
.tag button:hover{background:rgba(0,0,0,.08)}
.tag-in{border:none;background:transparent;color:var(--txt);font-family:inherit;font-size:12.5px;padding:4px;min-width:50px;flex:1}
.tag-in:focus{outline:none}
.entry-card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-s);padding:14px;margin-bottom:14px}
.entry-card .meta{font-size:12px;color:var(--txt-3);margin-top:6px}
.entry-card .meta b{color:var(--txt-2)}
.line-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.line-tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.line-tbl td{padding:7px 8px;border-bottom:1px solid var(--line-soft)}
.line-tbl td.num{text-align:right;font-family:'JetBrains Mono',monospace}
.line-tbl .x{color:var(--red);cursor:pointer;font-size:15px;background:none;border:none}
.paste-area{width:100%;min-height:78px;border:1px solid var(--line);border-radius:var(--radius-s);padding:9px;font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--bg-2);color:var(--txt);display:none;margin-top:10px}

/* theme switch in sidebar */
.theme-switch{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-s);padding:3px;width:100%}
.theme-switch button{flex:1;padding:6px 8px;border-radius:7px;font-size:12px;font-weight:600;color:var(--txt-2);display:flex;align-items:center;justify-content:center;gap:6px}
.theme-switch button.active{background:var(--accent-soft);color:var(--accent)}
.theme-switch button .ic{width:14px;height:14px}

/* print */
@media print{
  .side,.topbar,.toolbar,.no-print,.nav,.side-foot,.inv-toolbar,.price-panel{display:none!important}
  .main{display:block}
  .content{padding:0;max-width:none}
  body{background:#fff;color:#000;font-size:11px}
  .panel{border:1px solid #ccc;box-shadow:none;break-inside:avoid;margin-bottom:14px}
  thead th{background:#f0f0f0;color:#000}
  .kpi{border:1px solid #ccc}
  .print-head{display:block!important}
  /* invoice: full bleed, no app frame */
  .invoice{border:none;border-radius:0;max-width:none;padding:0;box-shadow:none}
  .invoice .brandbar{margin:0 0 16px 0;border-radius:0}
  .invoice .pofoot .poval{border-bottom:none}
  .invoice .brandbar,.invoice table.items th,.invoice .totes,.invoice table.items td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .invoice table.items tr{page-break-inside:avoid}
}
.print-head{display:none;margin-bottom:14px}
.print-head h1{font-size:18px;margin:0}
.print-head p{margin:3px 0 0;font-size:11px;color:#555}

@media(max-width:880px){
  .side{position:fixed;left:-240px;z-index:60;transition:.2s}
  .side.open{left:0}
  .menu-toggle{display:grid!important}
  .overlay-side{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .overlay-side.open{display:block}
}
.menu-toggle{display:none}
.sync-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--card,transparent);color:var(--txt,inherit);
  font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap;transition:.15s}
.sync-pill:hover{border-color:var(--accent,#2f5fd0)}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:#8b93a1;flex:none}
.sync-pill.idle .dot{background:#2c7a35}
.sync-pill.pending .dot{background:#c98a00}
.sync-pill.offline .dot{background:#c98a00}
.sync-pill.error .dot{background:#c5333f}
.sync-pill.error{border-color:#c5333f;color:#c5333f}
.sync-pill.syncing .dot{background:#2f5fd0;animation:syncSpin 1s linear infinite}

function byCodeSort(a,b){ return String(a.code).localeCompare(String(b.code),undefined,{numeric:true}); }
function buildProducts(priceBook){
  const map={};
  CATALOG.forEach(c=>{ map[c.code]={code:c.code, description:c.description, price:null, rmbPrice:null, factory:'', profiles:[]}; });
  Object.keys(priceBook||{}).forEach(code=>{ const o=priceBook[code];

}

let saveFailed = false;      // true once a write to localStorage has been rejected
let lastSaveBytes = 0;
function save(){
  bumpState();

  try{ payload = JSON.stringify(state); }
  catch(e){ saveFailed=true; console.error('Save failed (could not serialise state):',e);
    try{ renderBackupBanner(); }catch(_){}

    try{ renderBackupBanner(); }catch(_){}
    toast('SAVE FAILED — nothing was written. See the red banner.');
    return false;
  }
}

/* ============ DERIVED CALCS ============ */
/* ---------- LOOKUP INDEX ----------
   order()/container() used to scan the whole array on every call, and orderStats() looped
   every container and line per order — so drawing a list was roughly
   orders x containers x lines, twice over. These maps make each lookup constant time and
   pre-total each order's shipped quantities in a single pass.
   The index is rebuilt lazily whenever the data version changes; save() and render() bump
   it, which covers every path that mutates state. */
let _idxVer=-1, _stateVer=0;
let _orderById=new Map(), _containerById=new Map(), _allocByOrder=new Map();
function bumpState(){ _stateVer++; }
function ensureIndex(){
  if(_idxVer===_stateVer) return;
  _orderById=new Map(); _containerById=new Map(); _allocByOrder=new Map();
  for(const o of (state.orders||[])) _orderById.set(o.id,o);
  for(const c of (state.containers||[])){
    _containerById.set(c.id,c);
    const deliv = c.status==='Delivered';
    for(const l of (c.lines||[])){
      let a=_allocByOrder.get(l.orderId);
      if(!a){ a={inTransit:0,delivered:0}; _allocByOrder.set(l.orderId,a); }
      if(deliv) a.delivered+=l.qty; else a.inTransit+=l.qty;
    }
  }
  _idxVer=_stateVer;
}
function container(id){ ensureIndex(); return _containerById.get(id); }
function order(id){ ensureIndex(); return _orderById.get(id); }

// All allocations flattened: {orderId, containerId, qty, container}
function allAllocs(){
  const out=[];
  state.containers.forEach(c=> (c.lines||[]).forEach(l=> out.push({...l, containerId:c.id, container:c})));
  return out;
}
function orderStats(o){
  if(!o) return {inTransit:0,delivered:0,inProduction:0,packed:0,outstanding:0,cancelled:0,over:0};
  ensureIndex();
  const a=_allocByOrder.get(o.id);
  const inTransit=a?a.inTransit:0, delivered=a?a.delivered:0;
  const packed=inTransit+delivered;
  const cancelled=o.cancelled||0;
  const over=Math.max(0, packed - o.orderQty);                       // shipped beyond ordered
  const inProduction=Math.max(0, o.orderQty - packed - cancelled);   // still to make
  const outstanding=Math.max(0, o.orderQty - delivered - cancelled); // still owed
  return {inTransit, delivered, inProduction, packed, outstanding, cancelled, over};
}
function orderStatus(o){
  const s=orderStats(o);
  if(o.orderQty>0 && s.outstanding<=0) return 'Complete';   // nothing left owed — fully delivered and/or balance cancelled
  if(s.packed===0) return 'In Production';
  if(s.inProduction>0) return 'Partial';
  return 'On Water'; // fully packed/cancelled remainder, none short in production
}
function statusClass(st){
  return {'In Production':'st-grey','Partial':'st-amber','On Water':'st-blue',
          'Complete':'st-green','Delivered':'st-green','Cancelled':'st-red'}[st]||'st-grey';
}
function containerStats(c){
  const units=(c.lines||[]).reduce((a,l)=>a+l.qty,0);
  return {units, lines:(c.lines||[]).length, expDeliv:expDelivOf(c)};
}
function containerFactory(c){
  const first=(c.lines||[])[0]; if(!first) return '';
  const o=order(first.orderId); return o?(o.factory||''):'';
}
function expDelivOf(c){
  if(!c.eta) return null;
  const d=new Date(c.eta+'T00:00:00'); d.setDate(d.getDate()+ETA_BUFFER_DAYS);
  return d;
}
/* Transit time = ETA − ETD, in whole days. null when either date is missing. */
function transitDays(c){
  if(!c || !c.etd || !c.eta) return null;
  const a=new Date(c.etd+'T00:00:00'), b=new Date(c.eta+'T00:00:00');
  if(isNaN(a)||isNaN(b)) return null;
  return Math.round((b-a)/86400000);
}

/* ============ HELPERS ============ */
/* Monday–Saturday delivery week containing a date. A Sunday rolls into the week that starts the next day. */
function weekRangeOf(d){
  if(!d) return null;
  const x=(typeof d==='string')?new Date(d+'T00:00:00'):new Date(d);
  if(isNaN(x)) return null;
  const dow=x.getDay();                          // 0 = Sunday
  const mon=new Date(x); mon.setDate(x.getDate()+(dow===0?1:1-dow));
  const sat=new Date(mon); sat.setDate(mon.getDate()+5);
  return {from:mon, to:sat};
}
function fmtWeekRange(d){
  const r=weekRangeOf(d); if(!r) return '—';
  const mo=x=>x.toLocaleDateString('en-GB',{month:'short'}).replace(/\./g,'').slice(0,3);
  const sameMonth = r.from.getMonth()===r.to.getMonth() && r.from.getFullYear()===r.to.getFullYear();
  const yr = r.from.getFullYear()!==new Date().getFullYear() ? ' '+r.to.getFullYear() : '';
  return sameMonth
    ? r.from.getDate()+' – '+r.to.getDate()+' '+mo(r.to)+yr
    : r.from.getDate()+' '+mo(r.from)+' – '+r.to.getDate()+' '+mo(r.to)+yr;
}
function nf(n){ return (n||0).toLocaleString('en-US'); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
/* toLocaleDateString builds a fresh Intl formatter on every call, which made date
   formatting the single biggest cost of drawing a long list. Reuse one formatter per
   format and memoise by date string, since the same dates repeat constantly. */
const _dtfCache=new Map(), _dateMemo=new Map();
function _dtf(key, opts){
  let f=_dtfCache.get(key);
  if(!f){ f=new Intl.DateTimeFormat('en-GB', opts); _dtfCache.set(key,f); }
  return f;
}
function _fmtCached(key, opts, d){
  if(!d) return '—';
  const isStr=(typeof d==='string');
  const memoKey=isStr? key+'|'+d : null;
  if(memoKey!=null){ const hit=_dateMemo.get(memoKey); if(hit!==undefined) return hit; }
  const x=isStr? new Date(d+'T00:00:00') : d;
  const out=isNaN(x)? '—' : _dtf(key,opts).format(x);
  if(memoKey!=null){
    if(_dateMemo.size>4000) _dateMemo.clear();   // keep it bounded
    _dateMemo.set(memoKey,out);
  }
  return out;
}
function fmtDate(d){ return _fmtCached('long',{day:'numeric',month:'short',year:'numeric'},d); }
function fmtDateShort(d){ return _fmtCached('short',{day:'numeric',month:'short'},d); }
function monthKey(d){ const x=(typeof d==='string')?new Date(d+'T00:00:00'):d; return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); }
function monthLabel(d){ const x=(typeof d==='string')?new Date(d+'T00:00:00'):d; return _dtf('mon',{month:'short',year:'2-digit'}).format(x); }
function startOfWeek(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* parse an order's "period" (e.g. "2026-06" or "June") into a comparable month for bucketing */
function orderMonthDate(o){
  if(o.periodISO){ const [y,m]=o.periodISO.split('-'); return new Date(+y, +m-1, 1); }
  return null;
}

function dashWeeks(){ const mon=startOfWeek(new Date());
  const names=['This week','Next week','In 2 weeks','In 3 weeks','In 4 weeks','In 5 weeks'];
  return names.map((nm,i)=>{ const s=new Date(mon); s.setDate(s.getDate()+i*7); const e=new Date(s); e.setDate(e.getDate()+6);
    return {key:'w'+i,name:nm,cls:i===0?'now':i===1?'next':i<=3?'soon':'later',start:s,end:e}; }); }
function dashBucketOf(eta,weeks){ if(!eta) return {key:'none',name:'No ETA',cls:'later'};
  if(eta<weeks[0].start) return {key:'over',name:'Overdue / arrived',cls:'over'};
  for(const w of weeks){ if(eta>=w.start&&eta<=w.end) return {key:w.key,name:w.name,cls:w.cls}; }
  return {key:'later',name:'Later',cls:'later'}; }
function dashContainers(weeks){

    const eta=c.eta?new Date(c.eta+'T00:00:00'):null; const units=containerStats(c).units;
    const skus=new Set((c.lines||[]).map(l=>{const o=order(l.orderId);return o?o.code:'';}).filter(Boolean)).size;
    return {id:c.id,containerNo:c.containerNo||'—',vessel:c.vessel||'—',line:c.line||'—',eta,etaStr:eta?fmtDateShort(eta):'—',units,skus,bucket:dashBucketOf(eta,weeks)};

function dashChartSVG(buckets){
  const W=660,H=200,padB=34,padT=20,padL=8,padR=8,plotH=H-padB-padT;
  const max=Math.max(1,...buckets.map(b=>b.val)); const n=buckets.length, gap=10, bw=(W-padL-padR-gap*(n-1))/n;
  let s='';
  for(let g=0;g<=2;g++){ const gy=padT+plotH*(g/2); s+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>`; }
  buckets.forEach((b,i)=>{ const x=padL+i*(bw+gap); const bh=b.val/max*plotH; const y=padT+plotH-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(b.val>0?2:0,bh)}" rx="4" fill="${b.color}"/>`;
    if(b.val>0) s+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--txt)">${b.val}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--txt-3)">${esc(b.name)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="200" preserveAspectRatio="xMidYMid meet" style="font-family:Inter,sans-serif">${s}</svg>`;
}

/* ---------- LIVE SEARCH ----------
   These refresh only the results list, leaving the search input untouched so focus and
   the caret survive. Calling render() on every keystroke rebuilt the whole view, which
   destroyed the input mid-type. The rebuild is deferred one animation frame so a fast
   typist's keystrokes coalesce instead of queueing up. */
let _searchRaf=null;
const _hasRaf = (typeof requestAnimationFrame==='function');
function scheduleSearch(fn){
  if(_searchRaf!=null){ _hasRaf? cancelAnimationFrame(_searchRaf) : clearTimeout(_searchRaf); }
  const run=()=>{ _searchRaf=null; fn(); };
  _searchRaf = _hasRaf? requestAnimationFrame(run) : setTimeout(run,16);
}

}

/* The list is built separately from the toolbar so typing in the search box can refresh

function ordersListHTML(){
  const f=filters.orders;
  const rows=visibleOrderRows();
  if(!rows.length) return `<div class="panel"><div class="panel-body">${emptyBlock(state.orders.length?'No orders match these filters':'No orders yet','order','Click “New order” to add your first order in production.')}</div></div>`;
  const map={};
  rows.forEach(r=>{ const k=r.o.orderGroup||r.o.id;
    (map[k]=map[k]||{key:k,po:r.o.po||'',period:r.o.period||'',periodISO:r.o.periodISO||'',orders:[]}).orders.push(r.o); });
  let groups=Object.values(map).sort(cmpGroupOldestFirst);
  if(f.status==='all' && !f.showDone){
    groups=groups.filter(g=> groupStatusFrom(groupAgg(g.orders))!=='Complete');
  }
  if(!groups.length) return `<div class="panel"><div class="panel-body">${emptyBlock('No active orders','done', f.showDone?'No orders match these filters.':'Completed orders are hidden — use “Show completed” to see them.')}</div></div>`;
  return groups.map(orderGroupCard).join('');
}
function groupAgg(orders){
  const a={ordered:0,inProduction:0,inTransit:0,delivered:0,outstanding:0,cancelled:0};
  orders.forEach(o=>{ const s=orderStats(o);
    a.ordered+=o.orderQty; a.inProduction+=s.inProduction; a.inTransit+=s.inTransit;
    a.delivered+=s.delivered; a.outstanding+=s.outstanding; a.cancelled+=s.cancelled||0; });
  return a;
}
function groupStatusFrom(a){
  if(a.ordered>0 && a.outstanding<=0) return 'Complete';   // whole PO closed out — delivered and/or cancelled
  if((a.inTransit+a.delivered)===0) return 'In Production';
  if(a.inProduction>0) return 'Partial';
  return 'On Water';
}

function sortArrow(key){ return orderLineSort.key===key? (orderLineSort.dir>0?' ▲':' ▼') : ''; }
function setOrderLineSort(key){ if(orderLineSort.key===key) orderLineSort.dir*=-1; else orderLineSort={key,dir:1}; render(); }
function sortedGroupLines(orders){
  const k=orderLineSort.key, dir=orderLineSort.dir;
  const v=(o)=>{ const s=orderStats(o); switch(k){
    case 'profile': return String(o.profile||'').toLowerCase();
    case 'description': return String(o.description||'').toLowerCase();
    case 'ordered': return o.orderQty||0;
    case 'inProduction': return s.inProduction;
    case 'inTransit': return s.inTransit;
    case 'delivered': return s.delivered;
    case 'outstanding': return s.outstanding;
    case 'status': return orderStatus(o);
    default: return String(o.code||'').toLowerCase(); } };
  return orders.slice().sort((a,b)=>{ const va=v(a), vb=v(b);
    if(va<vb) return -1*dir; if(va>vb) return 1*dir; return String(a.code).localeCompare(String(b.code)); });
}

function toggleOrderGroup(key){
  const body=document.getElementById('obody-'+key); const card=document.querySelector('[data-og="'+key+'"]');
  if(expandedOrderGroups.has(key)){ expandedOrderGroups.delete(key); if(body) body.style.display='none'; if(card) card.classList.remove('open'); }
  else { expandedOrderGroups.add(key);
    if(body){ if(!body.innerHTML.trim()){ const g=orderGroups().find(x=>x.key===key); if(g) body.innerHTML=orderGroupBodyHTML(g); } body.style.display='block'; }
    if(card) card.classList.add('open'); }
}
function expandAllOrders(){ orderGroups().forEach(g=>expandedOrderGroups.add(g.key)); render(); }
function collapseAllOrders(){ expandedOrderGroups.clear(); render(); }
function deleteOrderGroup(key){
  const g=orderGroups().find(x=>x.key===key); if(!g) return;
  const ids=g.orders.map(o=>o.id);
  const used=state.containers.some(c=>(c.lines||[]).some(l=>ids.includes(l.orderId)));
  const head=`Delete PO ${g.po||'(no PO)'} — ${g.period||''} and all ${g.orders.length} line${g.orders.length===1?'':'s'}?`;
  const msg=used? head+'\n\nSome of this stock is packed on containers; those shipment lines will be removed too.' : head;
  if(!confirm(msg)) return;
  if(used) state.containers.forEach(c=>{ c.lines=(c.lines||[]).filter(l=>!ids.includes(l.orderId)); });
  state.orders=state.orders.filter(o=>!ids.includes(o.id));
  expandedOrderGroups.delete(key);
  save(); render(); toast('PO deleted');
}

function renderPoExisting(){

function removePoLine(i){

function savePoEdit(){
  const month=val('po_month');
  const mEl=document.getElementById('po_month');
  if(!month){ mEl.classList.add('err'); toast('Pick an order month'); return; }
  mEl.classList.remove('err');
  // fold in a part-filled entry row
  if(val('o_code').trim() && +val('o_qty')>0) addOrderLine();
  if(!poEdit.existing.length && !orderLines.length){ toast('A PO needs at least one line'); return; }
  const bad=poEdit.existing.find(l=>!(+l.qty>0));
  if(bad){ toast('Order qty must be more than zero for '+bad.code); return; }
  const shortfall=poEdit.existing.filter(l=>+l.qty < l.packed);
  if(shortfall.length && !confirm(shortfall.map(l=>l.code+': ordering '+nf(+l.qty)+' but '+nf(l.packed)+' already shipped').join('\n')+
      '\n\nThese lines will show as over-shipped. Continue?')) return;

  const po=val('po_po').trim();
  const plannedEtd=val('po_petd')||null, plannedEta=val('po_peta')||null;
  const periodLabel=new Date(month+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const key=poEdit.key;

  // remove deleted lines (and any container allocations pointing at them)
  if(poEdit.removed.length){
    state.containers.forEach(c=>{ c.lines=(c.lines||[]).filter(l=>!poEdit.removed.includes(l.orderId)); });
    state.orders=state.orders.filter(o=>!poEdit.removed.includes(o.id));
  }

  poEdit.existing.forEach(l=>{ const o=order(l.id); if(!o) return;
    o.orderGroup=key; o.po=po; o.period=periodLabel; o.periodISO=month;

  orderLines.forEach(l=>{ const p=productByCode(l.code);

      code:l.code, description:l.description||(p?p.description:'')||'', profile:l.profile||'',
      price:(l.price!=null&&l.price!=='')?+l.price:(p&&p.price!=null&&p.price!==''?+p.price:null),
      rmbPrice:(l.rmbPrice!=null&&l.rmbPrice!=='')?+l.rmbPrice:(p&&p.rmbPrice!=null&&p.rmbPrice!==''?+p.rmbPrice:null),
      factory:l.factory||(p?p.factory:'')||'', orderQty:l.qty, comment:'' }); });

  const added=orderLines.length, removed=poEdit.removed.length;
  expandedOrderGroups.add(key);
  save(); closeModal(); render(); fillFactoryList();
  toast('PO updated'+(added?' · '+added+' line'+(added>1?'s':'')+' added':'')+(removed?' · '+removed+' removed':''));
}

let expandedContainers = new Set();
let selectedContainers = new Set();
let shipmentClipboard = null;
function visibleContainers(){
  const f=filters.containers;
  let cs=state.containers.slice();
  if(f.status!=='all') cs=cs.filter(c=>c.status===f.status);
  if(f.q){
    /* Container numbers display without spaces, so match with and without them —
       typing what you see on screen has to work, as does the spaced form on paperwork. */
    const q=f.q.toLowerCase(), qz=q.replace(/\s+/g,'');
    cs=cs.filter(c=>{
      const hay=[c.containerNo,c.vessel,c.line,containerFactory(c)].join(' ').toLowerCase();
      return hay.includes(q) || hay.replace(/\s+/g,'').includes(qz);
    });
  }
  cs.sort((a,b)=>{ const ea=a.eta?+new Date(a.eta):Infinity, eb=b.eta?+new Date(b.eta):Infinity; return ea-eb || (a.createdAt||0)-(b.createdAt||0); });
  return cs;
}

/* Discharge terminals. Kept as a list so adding a fourth is a one-line change. */
const TERMINALS = ['DGT','Pier 1','MPT'];

/* One-off tidy of records made before these two fields existed.
   - Terminal used to be typed into the free-text comment, so an exact match on a
     known terminal is moved across and the comment cleared. Anything else is left
     alone — it is a real comment.
   - Existing containers are marked final so nothing already on the water suddenly
     turns blue. New ones start unticked, see openPackModal. */
function migrateContainerFields(){
  let n=0;
  (state.containers||[]).forEach(c=>{
    if(c.finalVessel===undefined){ c.finalVessel=true; n++; }
    if(c.terminal===undefined){
      const hit=TERMINALS.find(t=>t.toLowerCase()===String(c.comment||'').trim().toLowerCase());
      if(hit){ c.terminal=hit; c.comment=''; } else { c.terminal=''; }
      n++;
    }
  });
  if(n) save();
}

/* Earliest ETD across every container carrying this order — the day its stock
   actually started moving. Later containers on the same order do not change it. */
function orderActualEtd(o){
  let best=null;
  (state.containers||[]).forEach(c=>{
    if(!c.etd) return;
    if(!(c.lines||[]).some(l=>l.orderId===o.id)) return;
    if(!best || c.etd<best) best=c.etd;
  });
  return best;
}

let codeLookupState = { q:'' };
function codeLookupSearch(v){

function codeLookupMatches(){
  const q=(codeLookupState.q||'').trim().toLowerCase();
  if(!q) return [];
  return state.orders.filter(o=>{
    if(orderStats(o).outstanding<=0) return false;   // fully delivered/cancelled — nothing left to track
    return String(o.code||'').toLowerCase().includes(q) || String(o.description||'').toLowerCase().includes(q);
  });
}
function viewCodeLookup(){
  const q=codeLookupState.q;

  matches.forEach(o=>{ (groups[o.code]=groups[o.code]||[]).push(o); });
  const codes=Object.keys(groups).sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  codes.forEach(code=>groups[code].sort((a,b)=>{
    const pa=String(a.profile||'').toLowerCase(), pb=String(b.profile||'').toLowerCase();

function codeLookupRow(o){

/* ---------- OUTSTANDING (weekly buckets) ---------- */
function osReportModel(){
  const baseStart = startOfWeek(state.settings.weekStart?new Date(state.settings.weekStart):new Date());
  const weeks=[]; for(let i=0;i<8;i++){ const s=new Date(baseStart); s.setDate(s.getDate()+i*7); const e=new Date(s); e.setDate(e.getDate()+6); weeks.push({s,e}); }
  const rows=state.orders.map(o=>({o,s:orderStats(o)})).filter(r=>r.s.outstanding>0);
  function buckets(o){
    const b=new Array(8).fill(0); let unsched=0;
    state.containers.forEach(c=>{ if(c.status!=='On Water') return;
      (c.lines||[]).forEach(l=>{ if(l.orderId!==o.id) return; const e=expDelivOf(c);
        if(!e){ unsched+=l.qty; return; }
        let placed=false;
        for(let i=0;i<8;i++){ if(e>=weeks[i].s && e<=weeks[i].e){ b[i]+=l.qty; placed=true; break; } }
        if(!placed) unsched+=l.qty;
      });
    });
    unsched += orderStats(o).inProduction;
    return {b,unsched};
  }
  rows.sort((a,b)=> (a.o.period||'').localeCompare(b.o.period||''));
  return {baseStart, weeks, rows, buckets};
}
function viewOutstanding(){
  const {baseStart, weeks, rows, buckets}=osReportModel();
  return `
  <div class="print-head"><h1>Outstanding Orders — arrival schedule</h1><p>O/S = Ordered − Delivered · week from ${fmtDate(baseStart)}</p></div>
  <div class="toolbar no-print">
    <div style="font-size:13px;color:var(--txt-2)">Week starting
      <input type="date" value="${baseStart.toISOString().slice(0,10)}" onchange="state.settings.weekStart=this.value;save();render()"
        style="margin-left:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--txt)"></div>
    <button class="btn" onclick="exportOSReport()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 2v6h6"/><path d="M9 13l2 3 2-3 2 3" stroke-linecap="round"/></svg> Export to Excel</button>
    <div style="flex:1"></div><span class="minor" style="font-size:12.5px">In-transit stock buckets by expected delivery. In-production stock has no ETA → Unscheduled.</span>
  </div>
  <div class="panel"><div class="tbl-wrap matrix">
    ${rows.length?`<table><thead><tr><th>Month</th><th>PO</th><th>Code</th><th>Profile</th><th>Description</th><th class="num">Ordered</th><th class="num">O/S</th>
      ${weeks.map(w=>`<th class="num month-col">${fmtDateShort(w.s)}–${fmtDateShort(w.e)}</th>`).join('')}<th class="num">Unscheduled</th></tr></thead>
    <tbody>${rows.map(({o,s})=>{ const {b,unsched}=buckets(o); return `<tr class="clickable" onclick="openOrderDetail('${o.id}')">
      <td>${esc(o.period)}</td><td class="mono minor">${esc(o.po||'—')}</td><td class="code-cell mono">${esc(o.code)}</td><td>${esc(o.profile||'—')}</td>
      <td class="desc-cell" title="${esc(o.description)}">${esc(o.description)}</td>
      <td class="num">${nf(o.orderQty)}</td><td class="num"><b>${nf(s.outstanding)}</b></td>
      ${b.map(x=>`<td class="num ${x?'':'zero'}">${x?nf(x):'·'}</td>`).join('')}
      <td class="num ${unsched?'':'zero'}">${unsched?nf(unsched):'·'}</td></tr>`;}).join('')}
      ${totalsRow(rows.map(r=>r.o),weeks,buckets)}
      </tbody></table>`
    : emptyBlock('Nothing outstanding','done','Every order has been fully delivered, or you have no orders yet.')}
  </div></div>`;
}
function totalsRow(orders,weeks,buckets){
  const tot=new Array(8).fill(0); let tUns=0,tOrd=0,tOS=0;
  orders.forEach(o=>{ const {b,unsched}=buckets(o); b.forEach((x,i)=>tot[i]+=x); tUns+=unsched; tOrd+=o.orderQty; tOS+=orderStats(o).outstanding; });
  return `<tr class="group-row"><td colspan="5">Total</td><td class="num">${nf(tOrd)}</td><td class="num">${nf(tOS)}</td>
    ${tot.map(x=>`<td class="num">${x?nf(x):'·'}</td>`).join('')}<td class="num">${tUns?nf(tUns):'·'}</td></tr>`;
}

/* ---------- ARRIVALS BY MONTH ----------
   One row per CODE, not per order. A code ordered in July, August and September
   used to spread across three rows, which made "how much of 1-274 lands in
   October" a mental sum. Now the quantities are combined and the order months
   that fed them are spelled out in the Orders column instead. */
function arrivalsMonths(){
  const base = state.settings.weekStart?new Date(state.settings.weekStart):new Date();
  const start=new Date(base.getFullYear(), base.getMonth(), 1);
  const months=[]; for(let i=0;i<6;i++){ const d=new Date(start); d.setMonth(d.getMonth()+i); months.push(d); }
  return months;
}
function orderBuckets(o, mKeys){
  const b=new Array(mKeys.length).fill(0); let noEta=0;
  (state.containers||[]).forEach(c=>{ if(c.status!=='On Water') return;
    (c.lines||[]).forEach(l=>{ if(l.orderId!==o.id) return; const e=expDelivOf(c);
      if(!e){ noEta+=l.qty; return; }
      const idx=mKeys.indexOf(monthKey(e)); if(idx>=0) b[idx]+=l.qty; else noEta+=l.qty; });
  });
  /* In production is NOT guessed into an arrival month any more. It has no ETA by
     definition, so putting it under the order month mixed "arriving" with "not yet
     shipped" in the same figure. It gets its own column instead, and No ETA now
     means exactly one thing: on the water with no expected-delivery date. */
  const inProd=orderStats(o).inProduction;
  return {b, noEta, inProd:inProd>0?inProd:0};
}
/* "July 2026" -> "Jul". Falls back to whatever the period string says. */
function shortPeriod(o){
  if(o.periodISO){ const d=new Date(o.periodISO+'-01T00:00:00');
    if(!isNaN(d)) return d.toLocaleString('en',{month:'short'}); }
  return (o.period||'').split(' ')[0].slice(0,3) || '?';
}
function arrivalsRows(){
  const months=arrivalsMonths(); const mKeys=months.map(monthKey);
  const groups=new Map();
  state.orders.map(o=>({o,s:orderStats(o)})).filter(r=>r.s.outstanding>0).forEach(({o,s})=>{
    const key=String(o.code||'?');
    let g=groups.get(key);
    if(!g){ g={code:key, profile:o.profile||'', description:o.description||'',
               factories:new Set(), statuses:new Set(), orders:[],
               outstanding:0, b:new Array(mKeys.length).fill(0), noEta:0, inProd:0}; groups.set(key,g); }
    if(o.factory) g.factories.add(o.factory);
    g.statuses.add(orderStatus(o));
    g.outstanding += s.outstanding;
    if(!g.profile && o.profile) g.profile=o.profile;
    if(!g.description && o.description) g.description=o.description;
    const {b,noEta,inProd}=orderBuckets(o,mKeys);
    b.forEach((x,i)=>g.b[i]+=x); g.noEta+=noEta; g.inProd+=inProd;
    g.orders.push({o, outstanding:s.outstanding, inProd, sort:o.periodISO||o.period||''});
  });
  const rows=[...groups.values()];
  rows.forEach(g=>{
    g.orders.sort((a,b)=>String(a.sort).localeCompare(String(b.sort)));
    /* The Orders column: which order months make up this row, and how much of each is
       still in production — "Jul 200 · Aug 300 (100 in production) · Sep 100 in production". */
    g.note=g.orders.map(x=>{
      const m=shortPeriod(x.o);
      if(!x.inProd) return m+' '+nf(x.outstanding);
      if(x.inProd>=x.outstanding) return m+' '+nf(x.outstanding)+' in production';
      return m+' '+nf(x.outstanding)+' ('+nf(x.inProd)+' in production)';
    }).join(' · ');
    g.factory=[...g.factories].sort().join(', ');
    g.status=g.statuses.size===1?[...g.statuses][0]:'Mixed';
  });
  rows.sort((a,b)=>String(a.code).localeCompare(String(b.code),undefined,{numeric:true}));
  return {months,mKeys,rows};
}

/* ---------- PROFIT & LOSS ENGINE ---------- */
/* A PNL record is a SNAPSHOT. Once a container is added its figures are frozen — the ROE,
   the charges and the per-line prices are all stored on the record. That way updating the
   exchange rate next month never silently rewrites last month's profit. Use "Recalculate"
   on a row to deliberately pull today's numbers through. */
function pnlRec(containerId){ return (state.pnl||[]).find(r=>r.containerId===containerId); }
function inPnl(containerId){ return !!pnlRec(containerId); }
function numOrNull(v){ return (v!=null && v!=='' && isFinite(v))? Number(v): null; }

/* Forwarding rate depends on where it loaded and what type of box it is. Quoted in USD. */
function fwdChargeFor(c){
  const sc=state.shippingCharges||{};
  const pol=(c.pol||'').trim(), type=(c.containerType||'').trim();
  if(pol==='Hebei') return {label:'Forwarding — Hebei', usd:numOrNull(sc.fwdHebei)};
  if(pol==='Shenzhen'){
    if(type==='40NOR') return {label:'Forwarding — Shenzhen NOR', usd:numOrNull(sc.fwdShenzhenNor)};
    if(type==='40HQ')  return {label:'Forwarding — Shenzhen HQ',  usd:numOrNull(sc.fwdShenzhenHQ)};
    return {label:'Forwarding — Shenzhen (container type not set)', usd:null};
  }
  return {label:'Forwarding (port of load not set)', usd:null};
}

/* Build a fresh snapshot for a container. Never mutates state. */
function buildPnlSnapshot(containerId){
  const c=container(containerId); if(!c) return null;
  const sc=state.shippingCharges||{};
  const roe=numOrNull(sc.roe), rmbToUsd=numOrNull(sc.rmbToUsd);
  const clearing=numOrNull(sc.clearing), transport=numOrNull(sc.transport);
  const fwd=fwdChargeFor(c);
  /* Forwarding is quoted in dollars: USD -> RMB at the RMB/USD rate, then RMB -> rand at the ROE. */
  const fwdRmb = (fwd.usd!=null && rmbToUsd!=null)? fwd.usd*rmbToUsd : null;
  const fwdZar = (fwdRmb!=null && roe!=null && roe>0)? fwdRmb/roe : null;

  /* Sell side mirrors the invoice exactly: same aggregation, same price resolution.
     The invoice subtotal is already ex-VAT (it adds 15% on top), so it IS the selling figure. */
  const items=itemsFromContainer(c);
  const rmbByKey={};
  (c.lines||[]).forEach(l=>{ const o=order(l.orderId); if(!o) return;
    const price=resolveLinePrice(o);
    const key=(o.code||'?')+'|'+(price==null?'_':price);
    const unit=resolveLineRmb(o);
    if(!rmbByKey[key]) rmbByKey[key]={unit, mixed:false};
    else if(rmbByKey[key].unit!==unit){ rmbByKey[key].mixed=true; if(rmbByKey[key].unit==null) rmbByKey[key].unit=unit; }
  });

  const lines=items.map(it=>{
    const r=rmbByKey[it.code+'|'+(it.price==null?'_':it.price)]||{unit:null,mixed:false};
    return {code:it.code, qty:it.qty, sellUnit:it.price,
            sellTotal: it.price!=null? it.price*it.qty : null,
            rmbUnit:r.unit, rmbTotal: r.unit!=null? r.unit*it.qty : null, mixedRmb:r.mixed};
  });

  const missingSell=[...new Set(lines.filter(l=>l.sellTotal==null).map(l=>l.code))];
  const missingRmb =[...new Set(lines.filter(l=>l.rmbTotal==null).map(l=>l.code))];
  const selling=lines.reduce((a,l)=>a+(l.sellTotal||0),0);
  const rmbTotal=lines.reduce((a,l)=>a+(l.rmbTotal||0),0);
  const goodsZar=(roe!=null && roe>0)? rmbTotal/roe : null;

  const issues=[];
  if(!lines.length)      issues.push('Container has no stock lines');
  if(missingRmb.length)  issues.push('No RMB price: '+missingRmb.join(', '));
  if(missingSell.length) issues.push('No selling price: '+missingSell.join(', '));
  if(roe==null||roe<=0)  issues.push('RMB to Rand rate not set in Shipping charges');
  if(rmbToUsd==null||rmbToUsd<=0) issues.push('RMB to USD rate not set in Shipping charges');
  if(clearing==null)     issues.push('Clearing charge not set');
  if(transport==null)    issues.push('Transport charge not set');
  if(fwd.usd==null)      issues.push(/not set\)/.test(fwd.label)? fwd.label.replace(/^Forwarding — /,'Forwarding: ') : 'Forwarding charge not set');

  const cost=(goodsZar==null)? null : goodsZar+(clearing||0)+(transport||0)+(fwdZar||0);

  return { containerId, containerNo:c.containerNo||'', deliveredAt:c.deliveredAt||null,
    eta:c.eta||null, pol:c.pol||'', containerType:c.containerType||'', addedAt:Date.now(),
    roe, rmbToUsd, clearing, transport, fwdLabel:fwd.label, fwdUsd:fwd.usd, fwdRmb, fwd:fwdZar,
    lines, selling, sellingOverride:null, rmbTotal, goodsZar, cost,
    issues, complete: issues.length===0 };
}
/* Selling figure actually used — a manual override wins over the calculated one. */
function pnlSelling(r){ return r.sellingOverride!=null? Number(r.sellingOverride): (r.selling||0); }
function pnlCost(r){ return r.cost; }
function pnlProfit(r){ const c=pnlCost(r); return c==null? null : pnlSelling(r)-c; }
function pnlMargin(r){ const s=pnlSelling(r), p=pnlProfit(r); return (p==null||!s)? null : p/s*100; }
/* Month a container's profit belongs to — the month it actually landed. */
function pnlMonth(r){
  const d=r.deliveredAt||r.eta; if(!d) return {iso:'', label:'(no delivery date)'};
  const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return {iso:'', label:'(no delivery date)'};
  return {iso:String(d).slice(0,7), label:dt.toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
}

function addToPnl(containerId){
  const c=container(containerId); if(!c) return;
  if(c.status!=='Delivered'){ toast('Only delivered containers can go into the P&L'); return; }
  if(inPnl(containerId)){ toast('Already in the P&L'); return; }
  const snap=buildPnlSnapshot(containerId); if(!snap){ toast('Could not read that container'); return; }
  state.pnl=state.pnl||[]; state.pnl.push(snap);
  if(save()) toast(snap.complete? 'Added to P&L' : 'Added to P&L — some figures are missing, see the report');
  render();
}
function removeFromPnl(containerId){
  if(!confirm('Remove this container from the P&L?\n\nNothing else is deleted and you can add it back at any time.')) return;
  state.pnl=(state.pnl||[]).filter(r=>r.containerId!==containerId);
  if(save()) toast('Removed from P&L');
  render();
}
function recalcPnlRow(containerId){
  const old=pnlRec(containerId); if(!old) return;
  if(!confirm("Recalculate this container using today's prices, exchange rate and charges?\n\nThe stored figures will be replaced.")) return;
  const snap=buildPnlSnapshot(containerId); if(!snap){ toast('Could not rebuild that container'); return; }
  snap.sellingOverride=old.sellingOverride;      // a manual selling figure is deliberate — keep it
  snap.addedAt=old.addedAt; snap.recalcAt=Date.now();
  state.pnl=(state.pnl||[]).map(r=>r.containerId===containerId? snap : r);
  if(save()) toast(snap.complete? 'Recalculated' : 'Recalculated — figures still missing');
  render(); openPnlDetail(containerId);
}
function setPnlOverride(containerId, raw){
  const r=pnlRec(containerId); if(!r) return;
  const v=String(raw||'').replace(/[^0-9.\-]/g,'');
  r.sellingOverride = v===''? null : (isFinite(+v)? +v : null);
  save(); render(); openPnlDetail(containerId);
}

function avgTransitData(){
  const delivered=state.containers.filter(c=>c.status==='Delivered');
  const rows=delivered.map(c=>({c, port:((c.pol||'').trim()||'Not specified'), d:transitDays(c)}))
    .filter(r=>r.d!=null && r.d>=0)
    .sort((a,b)=>a.d-b.d);
  const groups={};
  rows.forEach(r=>{
    const g=groups[r.port]||(groups[r.port]={port:r.port,days:[],direct:[],ts:[]});
    g.days.push(r.d);
    (r.c.transhipment?g.ts:g.direct).push(r.d);
  });
  const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
  const ports=Object.values(groups).map(g=>({
    port:g.port, n:g.days.length, avg:avg(g.days),
    min:Math.min(...g.days), max:Math.max(...g.days),
    directAvg:avg(g.direct), directN:g.direct.length,
    tsAvg:avg(g.ts), tsN:g.ts.length
  })).sort((a,b)=>a.avg-b.avg);
  const all=rows.map(r=>r.d);
  return {rows, ports, delivered:delivered.length, counted:rows.length,
    skipped:delivered.length-rows.length,
    overall:avg(all), min:all.length?Math.min(...all):null, max:all.length?Math.max(...all):null};
}
function d1(n){ return n==null?'—':(Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }

let pnlState={month:'all'};
function pnlRows(){
  const all=(state.pnl||[]).slice().map(r=>({r, m:pnlMonth(r)}))
    .sort((a,b)=> String(b.m.iso||'0000').localeCompare(String(a.m.iso||'0000'))
      || String(a.r.containerNo).localeCompare(String(b.r.containerNo)));
  const months=[...new Map(all.map(x=>[x.m.label,x.m])).values()]
    .sort((a,b)=> String(b.iso||'0000').localeCompare(String(a.iso||'0000')));
  const rows = pnlState.month==='all'? all : all.filter(x=>x.m.label===pnlState.month);
  const usable=rows.filter(x=>x.r.complete);
  const tot={
    selling: usable.reduce((a,x)=>a+pnlSelling(x.r),0),
    cost:    usable.reduce((a,x)=>a+(pnlCost(x.r)||0),0),
    n: rows.length, counted: usable.length, excluded: rows.length-usable.length
  };
  tot.profit=tot.selling-tot.cost;
  tot.margin=tot.selling? tot.profit/tot.selling*100 : null;
  return {rows, all, months, tot};
}
