/* ============================================================
   CLOUD SYNC  —  Google Sheets via an Apps Script Web App
   ------------------------------------------------------------
   Nothing in the app changes: localStorage is still the source of
   truth and everything works offline. This layer sits alongside it
   and moves individual records to and from a Google Sheet.

   How it decides what to send:
     A "shadow" copy remembers a short hash of every record the last
     time we successfully synced. On each sync we re-hash every record;
     anything whose hash changed is dirty and gets pushed. Anything in
     the shadow that has vanished from state is a delete. That means no
     existing app code had to be touched — every edit path is covered.

   How conflicts are settled:
     Per record, newest updatedAt wins — decided on the server. So two
     devices editing DIFFERENT orders both survive; two devices editing
     the SAME order, last save wins.

   Offline:
     If the fetch fails, the shadow is left untouched, so the same
     records stay dirty and go up on the next successful sync. The
     failed queue is implicit — there is nothing to lose.
   ============================================================ */
const SYNC_CFG_KEY    = 'mbf_sync_cfg_v1';
const SYNC_SHADOW_KEY = 'mbf_sync_shadow_v1';
const SYNC_TYPES      = ['orders','containers','products','pnl'];
const SYNC_INTERVAL_MS = 120000;   // background sync every 2 minutes
const SYNC_DEBOUNCE_MS = 4000;     // wait this long after an edit before pushing

function syncBlankCfg(){ return { url:'', token:'', deviceId:'', auto:true, lastPull:0, lastOkAt:null }; }
/* init:false means this device has never completed a sync. The first run is
   PULL ONLY. Without that, a freshly set-up device would treat its empty
   settings and shipping charges as a brand new edit and wipe the real ones
   for every other device. It pushes its own records on the pass straight after. */
function syncBlankShadow(){
  return { init:false, rec:{orders:{},containers:{},products:{},pnl:{},meta:{}},
           pend:{orders:{},containers:{},products:{},pnl:{},meta:{}} };
}
function syncPendMap(type){
  if(!syncShadow.pend) syncShadow.pend={orders:{},containers:{},products:{},pnl:{},meta:{}};
  if(!syncShadow.pend[type]) syncShadow.pend[type]={};
  return syncShadow.pend[type];
}
/* The moment a record first LOOKS changed, remember when. That timestamp — not the
   time it finally uploads — is what settles a conflict. Without this an edit made
   offline on Tuesday beats one made on another device on Wednesday, purely because
   it reached the server later. */
function syncStampEditTimes(){
  const now=Date.now(); let n=0;
  SYNC_TYPES.forEach(type=>{
    const pend=syncPendMap(type);
    (state[type]||[]).forEach(rec=>{
      const k=syncKeyOf(type,rec); if(!k) return;
      const prev=syncShadow.rec[type][k];
      if(prev && prev.h===syncHash(JSON.stringify(rec))) return;
      if(pend[k]==null){ pend[k]=now; n++; }
    });
  });
  const mpend=syncPendMap('meta');
  const mh=syncHash(JSON.stringify(syncMetaRecord()));
  if(!(syncShadow.rec.meta && syncShadow.rec.meta.h===mh) && mpend.meta==null){ mpend.meta=now; n++; }
  if(n) saveSyncShadow();
  return n;
}
function syncEmptyDiff(){
  return { orders:[], containers:[], products:[], pnl:[], meta:null,
           del:{orders:[],containers:[],products:[],pnl:[]} };
}
let syncCfg    = (function(){ try{ const r=localStorage.getItem(SYNC_CFG_KEY); return r? Object.assign(syncBlankCfg(),JSON.parse(r)) : syncBlankCfg(); }catch(e){ return syncBlankCfg(); } })();
let syncShadow = (function(){ try{ const r=localStorage.getItem(SYNC_SHADOW_KEY); const s=r?JSON.parse(r):null; return (s&&s.rec)? s : syncBlankShadow(); }catch(e){ return syncBlankShadow(); } })();

let syncState   = 'off';     // off | idle | syncing | error | offline
let syncMsg     = '';
let syncDirty   = false;
let syncBusy    = false;
let syncApplying= false;
let syncTimer   = null;
let syncLastPullCount = 0;

function saveSyncCfg(){ try{ localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg)); }catch(e){} }
function saveSyncShadow(){ try{ localStorage.setItem(SYNC_SHADOW_KEY, JSON.stringify(syncShadow)); }catch(e){} }
function syncConfigured(){ return !!(syncCfg.url && syncCfg.token); }
function syncDeviceId(){ if(!syncCfg.deviceId){ syncCfg.deviceId='dev_'+Math.random().toString(36).slice(2,9); saveSyncCfg(); } return syncCfg.deviceId; }

/* Fast non-cryptographic string hash (cyrb53). Only used to answer
   "did this record change since last sync", so collisions are harmless. */
function syncHash(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0,ch;i<str.length;i++){ ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}

/* Stable key per record. Orders and containers already carry an id.
   P&L rows are one-per-container. Products only have a code, which can be
   blank on a freshly added row, so they get a small permanent _sid. */
function syncKeyOf(type, rec){
  if(type==='orders' || type==='containers') return rec.id || null;
  if(type==='pnl') return rec.containerId || null;
  if(type==='products'){ if(!rec._sid) rec._sid='p_'+Math.random().toString(36).slice(2,9); return rec._sid; }
  return null;
}

/* Settings and shipping charges travel together as one "meta" record.
   Theme is deliberately excluded so dark on the PC doesn't fight light on the phone. */
function syncMetaRecord(){
  const s=Object.assign({}, state.settings||{}); delete s.theme;
  return { settings:s, shippingCharges: state.shippingCharges||{} };
}

function syncBuildDiff(){
  const now=Date.now();
  const out={ orders:[], containers:[], products:[], pnl:[], meta:null,
              del:{orders:[],containers:[],products:[],pnl:[]} };
  SYNC_TYPES.forEach(type=>{
    const arr=state[type]||[]; const seen={};
    arr.forEach(rec=>{
      const k=syncKeyOf(type,rec); if(!k) return;
      seen[k]=1;
      const json=JSON.stringify(rec), h=syncHash(json);
      const prev=syncShadow.rec[type][k];
      if(!prev || prev.h!==h){
        const pend=syncPendMap(type);
        if(pend[k]==null) pend[k]=now;
        out[type].push({id:k, updatedAt:pend[k], json});
      }
    });
    Object.keys(syncShadow.rec[type]||{}).forEach(k=>{
      if(!seen[k]){
        const pend=syncPendMap(type);
        if(pend[k]==null) pend[k]=now;
        out.del[type].push({id:k, updatedAt:pend[k]});
      }
    });
  });
  const mjson=JSON.stringify(syncMetaRecord()), mh=syncHash(mjson);
  if(!syncShadow.rec.meta || syncShadow.rec.meta.h!==mh){
    const mpend=syncPendMap('meta');
    if(mpend.meta==null) mpend.meta=now;
    out.meta={id:'meta', updatedAt:mpend.meta, json:mjson};
  }
  return out;
}
function syncPendingCount(d){
  d=d||syncBuildDiff();
  return SYNC_TYPES.reduce((a,t)=>a+d[t].length+d.del[t].length,0) + (d.meta?1:0);
}

/* Apply what the server sent back. The server has already settled any
   conflict, so its version wins here. */
function syncApplyRemote(changed){
  let n=0;
  SYNC_TYPES.forEach(type=>{
    const rows=changed[type]||[]; if(!rows.length) return;
    const arr = state[type] = state[type]||[];
    const idx = new Map(); arr.forEach((r,i)=>{ const k=syncKeyOf(type,r); if(k) idx.set(k,i); });
    const kill=[];
    rows.forEach(row=>{
      if(row.deleted){
        if(idx.has(row.id)) kill.push(idx.get(row.id));
        delete syncShadow.rec[type][row.id]; n++; return;
      }
      let rec; try{ rec=JSON.parse(row.json); }catch(e){ return; }
      if(idx.has(row.id)) arr[idx.get(row.id)]=rec; else arr.push(rec);
      syncShadow.rec[type][row.id]={h:syncHash(row.json), u:row.updatedAt}; n++;
    });
    kill.sort((a,b)=>b-a).forEach(i=>arr.splice(i,1));
  });
  if(changed.meta){
    let m=null; try{ m=JSON.parse(changed.meta.json); }catch(e){}
    if(m){
      const theme=(state.settings||{}).theme;
      state.settings=Object.assign({}, m.settings||{});
      if(theme) state.settings.theme=theme;
      if(m.shippingCharges) state.shippingCharges=m.shippingCharges;
      syncShadow.rec.meta={h:syncHash(changed.meta.json), u:changed.meta.updatedAt};
      n++;
    }
  }
  return n;
}

async function syncNow(manual, opts){
  if(!syncConfigured()){ if(manual) toast('Set up sync first — open the Sync tab'); return false; }
  if(syncBusy) return false;
  if(!navigator.onLine){ syncSetState('offline','No connection — changes are held on this device'); return false; }
  syncBusy=true;
  try{ return await syncRun(manual, opts||{}); }
  finally{ syncBusy=false; }
}
async function syncRun(manual, opts){
  syncSetState('syncing','');
  const initialising = !syncShadow.init && !opts.forcePush;
  let ok=false;
  try{
    const diff = initialising ? syncEmptyDiff() : syncBuildDiff();
    const body={ action:'sync', token:syncCfg.token, device:syncDeviceId(),
                 since:syncCfg.lastPull||0, records:diff };
    /* text/plain keeps the browser from sending a CORS preflight,
       which Apps Script web apps do not answer. */
    const res=await fetch(syncCfg.url,{ method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
    if(!res.ok) throw new Error('Server returned HTTP '+res.status);
    let data; try{ data=await res.json(); }
    catch(e){ throw new Error('Server did not return JSON — check the Web App URL ends in /exec'); }
    if(!data.ok) throw new Error(data.error||'Server refused the request');

    /* Push accepted — the shadow now matches what we sent. */
    SYNC_TYPES.forEach(type=>{
      const pend=syncPendMap(type);
      diff[type].forEach(r=>{ syncShadow.rec[type][r.id]={h:syncHash(r.json), u:r.updatedAt}; delete pend[r.id]; });
      diff.del[type].forEach(r=>{ delete syncShadow.rec[type][r.id]; delete pend[r.id]; });
    });
    if(diff.meta){ syncShadow.rec.meta={h:syncHash(diff.meta.json), u:diff.meta.updatedAt}; delete syncPendMap('meta').meta; }

    const applied=syncApplyRemote(data.changed||{});
    /* The marker is a small server-side counter. It must never be set from a clock:
       one millisecond value here and the device silently ignores every future row,
       while still reporting a healthy sync. That is exactly how a device goes deaf. */
    const mark=Number(data.now);
    if(!isFinite(mark) || mark<0 || mark>1e12){
      throw new Error('Server sent a bad sync marker ('+data.now+') — update Code.gs and redeploy');
    }
    syncCfg.lastPull=mark;
    syncLastPullCount=Object.keys(data.changed||{}).reduce(function(a,k){
      const v=(data.changed||{})[k]; return a+(Array.isArray(v)?v.length:(v?1:0)); },0);
    syncCfg.lastOkAt=Date.now();
    saveSyncCfg(); saveSyncShadow();

    if(applied){
      syncApplying=true; save(); syncApplying=false;
      try{ fillFactoryList(); render(); }catch(e){}
    }
    if(initialising){
      /* First contact done and everything already on the sheet is now here.
         Anything this device holds that the sheet has not got goes up next. */
      syncShadow.init=true; saveSyncShadow();
      return await syncRun(manual, {});
    }

    syncDirty=false; ok=true;
    syncSetState('idle', applied? (applied+' change'+(applied===1?'':'s')+' pulled in') : '');
    if(manual) toast(applied? ('Synced — '+applied+' change'+(applied===1?'':'s')+' pulled in') : 'Synced — everything up to date');
  }catch(e){
    const off = !navigator.onLine || /Failed to fetch|NetworkError|Load failed/i.test(e.message||'');
    syncSetState(off?'offline':'error', off? 'No connection — changes are held on this device' : (e.message||'Sync failed'));
    if(manual) toast(off? 'No connection — your changes are safe and will go up later' : ('Sync failed: '+(e.message||'')));
  }
  return ok;
}

function syncSetState(st,msg){
  syncState=st; syncMsg=msg||'';
  renderSyncPill();
  if(activeTab==='sync'){ try{ renderSyncPanel(); }catch(e){} }
}
function syncSchedule(){
  syncDirty=true; renderSyncPill();
  if(!syncConfigured() || !syncCfg.auto) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    /* Offline, syncNow returns before it ever builds a diff, so nothing would record
       WHEN these edits happened. Stamp them here instead. */
    if(!navigator.onLine){ try{ syncStampEditTimes(); }catch(e){} return; }
    syncNow(false);
  }, SYNC_DEBOUNCE_MS);
}

/* ---------- status pill in the top bar ---------- */
function syncAgoText(){
  if(!syncCfg.lastOkAt) return 'never synced';
  const m=Math.floor((Date.now()-syncCfg.lastOkAt)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function renderSyncPill(){
  const el=document.getElementById('syncPill'); if(!el) return;
  if(!syncConfigured()){
    el.className='sync-pill off';
    el.innerHTML='<span class="dot"></span><span class="lbl">Sync off</span>';
    el.title='Cloud sync is not set up — open the Sync tab';
    return;
  }
  let cls=syncState, lbl='';
  if(syncState==='syncing') lbl='Syncing…';
  else if(syncState==='error') lbl='Sync error';
  else if(syncState==='offline') lbl=syncDirty? 'Offline · pending' : 'Offline';
  else if(syncDirty){ cls='pending'; lbl='Pending'; }
  else lbl='Synced '+syncAgoText();
  el.className='sync-pill '+cls;
  el.innerHTML='<span class="dot"></span><span class="lbl">'+lbl+'</span>';
  el.title=(syncMsg||'Click to sync now')+' · last successful sync '+syncAgoText();
}

/* ---------- Sync tab ---------- */
function viewSync(){
  const cfgd=syncConfigured();
  const pending=cfgd? syncPendingCount() : 0;
  const counts=SYNC_TYPES.map(t=>({t, n:(state[t]||[]).length}));
  return `
  <div class="panel"><div class="panel-body">
    <div class="minor" style="font-size:12.5px;margin-bottom:14px">
      This device keeps its own copy of everything and works with no connection.
      Sync moves individual orders, containers, products and P&amp;L rows to and from your Google Sheet,
      so two devices editing different records both keep their work.
    </div>
    <div class="field-grid" style="display:grid;grid-template-columns:1fr;gap:16px;max-width:760px">
      <div class="field">
        <label>Apps Script Web App URL</label>
        <input id="syncUrl" type="text" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(syncCfg.url||'')}">
        <div class="minor" style="font-size:11px;margin-top:3px">Must end in <b>/exec</b> — not <b>/dev</b>.</div>
      </div>
      <div class="field">
        <label>Shared secret</label>
        <input id="syncToken" type="text" spellcheck="false" placeholder="the same SECRET you put in the script" value="${esc(syncCfg.token||'')}">
        <div class="minor" style="font-size:11px;margin-top:3px">Must match the SECRET line at the top of your Apps Script exactly.</div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input id="syncAuto" type="checkbox" ${syncCfg.auto?'checked':''} style="width:auto;margin:0">
          <span>Sync automatically in the background</span>
        </label>
        <div class="minor" style="font-size:11px;margin-top:3px">A few seconds after each edit, when you switch back to this tab, and every couple of minutes.</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <button class="btn primary" onclick="syncSaveSettings()">Save settings</button>
      <button class="btn" onclick="syncNow(true)">Sync now</button>
      <button class="btn" onclick="syncResend()">Re-upload everything</button>
      <button class="btn" onclick="syncResetDevice()">Reset this device's sync</button>
    </div>
  </div></div>

  <div class="panel" style="margin-top:14px"><div class="panel-body">
    <div id="syncPanelStatus"></div>
    <div class="minor" style="font-size:12px;margin-top:14px">
      On this device: ${counts.map(c=>'<b>'+c.n+'</b> '+c.t).join(' · ')}
      ${cfgd? ' · <b>'+pending+'</b> waiting to upload' : ''}
    </div>
    <div class="minor mono" style="font-size:11.5px;margin-top:14px;line-height:1.8;
         border-top:1px solid var(--line);padding-top:12px">
      Device ID <b>${esc(syncCfg.deviceId||'—')}</b> &nbsp;·&nbsp;
      read up to marker <b>${syncCfg.lastPull||0}</b> &nbsp;·&nbsp;
      last pull brought <b>${syncLastPullCount}</b> record${syncLastPullCount===1?'':'s'}<br>
      <span style="opacity:.75">The marker is a small counter, normally in the hundreds or low thousands.
      If it shows a huge number, this device has lost its place and will quietly ignore everything —
      use <b>Reset this device's sync</b>.</span>
    </div>
    <div class="minor" style="font-size:11.5px;margin-top:10px;line-height:1.6">
      <b>If the same record is edited on two devices</b>, the one saved last wins and the other version is replaced.
      Different records never clash. Deleting a record here deletes it everywhere on the next sync.<br>
      <b>Re-upload everything</b> pushes every record from this device up again, overwriting the Sheet's copy —
      run it only from the device whose data you trust.<br>
      <b>Reset this device's sync</b> is the opposite: this device throws away its own place in the queue
      and takes the sheet's version of everything. That is the one to use when a device has stopped
      receiving other devices' changes.
    </div>
  </div></div>`;
}
function renderSyncPanel(){
  const el=document.getElementById('syncPanelStatus'); if(!el) return;
  const map={ off:['#8b93a1','Not set up'], idle:['#2c7a35','Connected'], syncing:['#c98a00','Syncing…'],
              error:['#c5333f','Problem'], offline:['#c98a00','Offline'] };
  const st=syncConfigured()? syncState : 'off';
  const [col,lbl]=map[st]||map.idle;
  el.innerHTML='<div style="display:flex;align-items:center;gap:10px;font-size:13.5px">'+
    '<span style="width:10px;height:10px;border-radius:50%;background:'+col+';flex:none"></span>'+
    '<b>'+lbl+'</b><span class="minor">'+esc(syncMsg||('Last successful sync: '+syncAgoText()))+'</span></div>';
}
function syncSaveSettings(){
  const url=(document.getElementById('syncUrl').value||'').trim();
  const tok=(document.getElementById('syncToken').value||'').trim();
  const auto=document.getElementById('syncAuto').checked;
  if(url && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){
    if(!confirm('That URL does not look like an Apps Script Web App address.\n\nIt should look like:\nhttps://script.google.com/macros/s/AKfy…/exec\n\nSave it anyway?')) return;
  }
  syncCfg.url=url; syncCfg.token=tok; syncCfg.auto=auto; saveSyncCfg();
  toast('Sync settings saved');
  syncSetState(syncConfigured()?'idle':'off','');
  if(syncConfigured()) syncNow(true);
  render();
}
function syncResend(){
  if(!syncConfigured()){ toast('Set up sync first'); return; }
  if(!confirm("Re-upload everything from this device?\n\nEvery order, container, product and P&L row here is pushed up again and overwrites the Sheet's copy.\n\nOnly do this from the device whose data you trust.")) return;
  syncShadow=syncBlankShadow(); syncShadow.init=true; saveSyncShadow();
  syncNow(true, {forcePush:true});
}

function syncResetDevice(){
  if(!syncConfigured()){ toast('Set up sync first'); return; }
  const pending=syncPendingCount();
  let msg='Reset this device\'s sync?\n\nThis device gets a new identity and forgets how far it had read, '+
          'so the next sync pulls the whole sheet down fresh.\n\nNothing on the sheet or on your other devices is changed.';
  if(pending>0){
    msg='WARNING — this device has '+pending+' change'+(pending===1?'':'s')+' that has not been uploaded yet.\n\n'+
        'Resetting DISCARDS '+(pending===1?'it':'them')+' and takes the sheet\'s version instead.\n\n'+
        'Back up first if those edits matter. Continue?';
  }
  if(!confirm(msg)) return;
  syncCfg.deviceId=''; syncCfg.lastPull=0; saveSyncCfg(); syncDeviceId();
  syncShadow=syncBlankShadow(); saveSyncShadow();
  toast('Sync reset — pulling everything down');
  syncNow(true);
}

/* ---------- wiring ---------- */
(function(){
  const _save=save;
  save=function(){ const r=_save.apply(this,arguments); if(!syncApplying) syncSchedule(); return r; };
})();
window.addEventListener('online',  ()=>{ syncSetState('idle',''); syncNow(false); });
window.addEventListener('offline', ()=>syncSetState('offline','No connection — changes are held on this device'));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncNow(false); });
/* iOS does not reliably fire visibilitychange on a tab restored from the freezer,
   so catch the app waking up every other way it can. */
window.addEventListener('pageshow', ()=>syncNow(false));
window.addEventListener('focus',    ()=>syncNow(false));
setInterval(()=>{ if(syncConfigured() && syncCfg.auto && !document.hidden) syncNow(false); }, SYNC_INTERVAL_MS);
setInterval(renderSyncPill, 60000);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}


migrateContainerFields();
applyTheme(); fillFactoryList(); go('dashboard'); renderBackupBanner();
syncSetState(syncConfigured()?'idle':'off','');
if(syncConfigured()) syncNow(false);
</script>
</body>
</html>
